<!doctype html>
<meta charset="UTF-8" />
<title>Work Along With Me</title>

<button onclick="location.href = '/profile'">Back to profile</button>

<h1>Connections</h1>

<div id="tabs" role="tablist">
  <button role="tab" data-tab="search">Find users</button>
  <button role="tab" data-tab="friends">Friends</button>
  <button role="tab" data-tab="requests">Friend requests</button>
</div>

<section id="search" role="tabpanel">
  <input id="userSearch" type="search" placeholder="Search by username" autocomplete="off" />
  <ul id="searchResults"></ul>
</section>

<section id="friends" role="tabpanel" hidden>
  <!-- Filled in once adding friends is implemented -->
  <p class="empty">You don't have any friends yet.</p>
</section>

<section id="requests" role="tabpanel" hidden>
  <p class="empty">You don't have any friend requests.</p>
</section>

<script>
  const tabs = document.querySelectorAll("#tabs [role=tab]");

  const showTab = name => tabs.forEach(tab => {
    const selected = tab.dataset.tab === name;
    tab.setAttribute("aria-selected", selected);
    document.getElementById(tab.dataset.tab).hidden = !selected;
  });

  tabs.forEach(tab => tab.onclick = () => showTab(tab.dataset.tab));
  showTab("search");

  const searchInput = document.getElementById("userSearch");
  const searchResults = document.getElementById("searchResults");
  let latestQuery = "";

  searchInput.oninput = async () => {
    const query = searchInput.value;
    latestQuery = query;

    if (!query) {
      searchResults.replaceChildren();
      return;
    }

    const response = await fetch("/users/search?limit=7&q=" + encodeURIComponent(query));
    // Typing fast can make responses arrive out of order; only show the newest one
    if (query !== latestQuery || !response.ok) return;

    const users = await response.json();
    searchResults.replaceChildren(...users.map(user => {
      const item = document.createElement("li");

      const picture = document.createElement("img");
      picture.src = user.picture;
      picture.alt = "";

      const name = document.createElement("span");
      name.className = "username";
      name.textContent = user.username;

      const id = document.createElement("span");
      id.className = "user-id";
      id.textContent = user.id;

      const text = document.createElement("div");
      text.append(name, id);
      item.append(picture, text);
      return item;
    }));
  };
</script>

<style>
  #tabs {
    display: flex;
    gap: 4px;
    border-bottom: 2px solid #ccc;
  }

  #tabs [role=tab] {
    padding: 8px 16px;
    border: none;
    background: none;
    cursor: pointer;
  }

  #tabs [role=tab][aria-selected=true] {
    border-bottom: 2px solid #333;
    margin-bottom: -2px;
    font-weight: bold;
  }

  .empty {
    color: #555;
  }

  #searchResults {
    list-style: none;
    padding: 0;
  }

  #searchResults li {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0;
  }

  #searchResults img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 50%;
  }

  #searchResults .username {
    display: block;
    font-size: 1.1em;
  }

  #searchResults .user-id {
    display: block;
    font-size: 0.75em;
    color: #555;
  }
</style>
