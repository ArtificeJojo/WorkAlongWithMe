<!doctype html>
<meta charset="UTF-8" />
<title>Work Along With Me</title>

<div id="profileBar">
  <img id="profilePicture" src="{{ user.picture }}" alt="Profile picture" />
  <h1>{{ user.username }}</h1>
</div>

<div class="screen-frame"></div>

<div id="profileButtons">
  <button onclick="location.href = '/home'">Home</button>
  <button id="friendButton"></button>
  <button id="blockButton">Block</button>
</div>

<section id="projects">
  <h2>Projects</h2>
  <div id="projectGrid"></div>
  <p id="noProjects" class="empty" hidden>No projects yet.</p>
  <div id="pager" hidden>
    <button id="prevPage">Previous</button>
    <span id="pageLabel"></span>
    <button id="nextPage">Next</button>
  </div>
</section>

<script>
  // Projects this person created or joined, 6 per page, newest first
  (() => {
    const userId = {{ user.id|tojson }};
    const grid = document.getElementById("projectGrid");
    const pager = document.getElementById("pager");
    const prevPage = document.getElementById("prevPage");
    const nextPage = document.getElementById("nextPage");
    let page = 1;

    const projectCard = project => {
      const card = document.createElement("a");
      card.className = "project-card";
      card.href = `/project/${project.id}`;

      if (project.thumbnail) {
        const thumbnail = document.createElement("img");
        thumbnail.src = project.thumbnail;
        thumbnail.alt = "";
        card.append(thumbnail);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "no-thumbnail";
        card.append(placeholder);
      }

      const title = document.createElement("span");
      title.className = "title";
      title.textContent = project.title;

      const role = document.createElement("span");
      role.className = "role";
      role.textContent = project.role === "creator" ? "Creator" : "Contributor";

      // Creator + up to 3 members, with "+N" after the last picture for anyone not shown
      const people = document.createElement("div");
      people.className = "people";
      project.people.forEach(person => {
        const picture = document.createElement("img");
        picture.src = person.picture;
        picture.alt = person.username;
        picture.title = person.username;
        people.append(picture);
      });
      if (project.extra > 0) {
        const extra = document.createElement("span");
        extra.className = "extra";
        extra.textContent = `+${project.extra}`;
        people.append(extra);
      }

      card.append(title, role, people);
      return card;
    };

    const loadProjects = async () => {
      const response = await fetch(`/users/${userId}/projects?page=${page}`);
      if (!response.ok) return;
      const data = await response.json();
      page = data.page;

      grid.replaceChildren(...data.projects.map(projectCard));
      document.getElementById("noProjects").hidden = data.projects.length > 0;
      pager.hidden = data.pages <= 1;
      document.getElementById("pageLabel").textContent = `Page ${data.page} of ${data.pages}`;
      prevPage.disabled = data.page <= 1;
      nextPage.disabled = data.page >= data.pages;
    };

    prevPage.onclick = () => { page--; loadProjects(); };
    nextPage.onclick = () => { page++; loadProjects(); };
    loadProjects();
  })();
</script>

<dialog id="blockDialog">
  <p>
    Are you sure you want to block <strong>{{ user.username }}</strong>?
    This removes them as a friend and deletes any friend requests between you.
  </p>
  <button id="confirmBlock">Block</button>
  <button id="cancelBlock">Cancel</button>
</dialog>

<script>
  const user = {{ user|tojson }};
  const friendButton = document.getElementById("friendButton");

  // Friend button depends on how you relate to them (same rules as the search on /connections)
  const showRelationship = relationship => {
    user.relationship = relationship;
    friendButton.disabled = relationship === "request_sent" || relationship === "friends";
    friendButton.textContent = {
      none: "Add friend",
      request_received: "Accept request",
      request_sent: "Request pending",
      friends: "Friends",
    }[relationship];
  };

  friendButton.onclick = async () => {
    const url = user.relationship === "request_received"
      ? `/friends/requests/${user.id}/accept`
      : `/friends/requests/${user.id}`;
    const response = await fetch(url, { method: "POST" });
    if (!response.ok) {
      alert(await response.text());
      return;
    }
    showRelationship(user.relationship === "request_received" ? "friends" : (await response.json()).relationship);
  };

  showRelationship(user.relationship);

  // Blocking: confirm first, then leave (you can't view someone you've blocked)
  const blockDialog = document.getElementById("blockDialog");
  document.getElementById("blockButton").onclick = () => blockDialog.showModal();
  document.getElementById("cancelBlock").onclick = () => blockDialog.close();
  document.getElementById("confirmBlock").onclick = async () => {
    blockDialog.close();
    const response = await fetch(`/blocks/${user.id}`, { method: "POST" });
    if (!response.ok) {
      alert(await response.text());
      return;
    }
    location.href = "/home";
  };
</script>

<style>
  body {
    background-image: url('/Images/bg.png');
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    margin-top: 50px;
  }

  h1 {
    font-size: 36px;
    margin-bottom: 20px;
    margin-left: 500px;
    color: white;
  }

  h2{
    color: white;
  }

  button {
    background-color: rgb(107, 204, 236);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    border-radius: 16px;
  }

  #profileBar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-left: 60px;
  }

  #profilePicture {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
  }

  #profileButtons {
    display: flex;
    justify-content: right;
    gap: 20px;
    align-items: right;
    margin-right: 100px;
  }

  .screen-frame {
    position: fixed;
    inset: 4px;
    border: 4px solid rgb(35, 105, 246);
    border-radius: 8px;
    pointer-events: none;      /* lets you still click the things underneath */
    box-sizing: border-box;
  }

  #projects {
    margin: 40px 60px;
  }

  #projectGrid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }

  .project-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
    background-color: rgba(255, 255, 255, 0.4);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
  }

  .project-card:hover {
    background-color: rgba(255, 255, 255, 0.7);
  }

  .project-card img,
  .project-card .no-thumbnail {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
    background-color: rgba(0, 0, 0, 0.08);
  }

  .project-card .title {
    font-weight: bold;
  }

  .project-card .role {
    font-size: 0.8em;
    color: #555;
  }

  .project-card .people {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Overrides the thumbnail size from .project-card img */
  .project-card .people img {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    object-fit: cover;
    background-color: transparent;
  }

  .project-card .extra {
    font-size: 0.8em;
    font-weight: bold;
    color: #555;
  }

  #pager {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }

  #projects .empty {
    color: #555;
  }

  button:hover{
    background-color: rgb(107, 204, 236);
    animation: shake 0.4s;
  }


@keyframes shake {
  0% { transform: translate(1px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -2px) rotate(-1deg); }
  20% { transform: translate(-3px, 0px) rotate(1deg); }
  30% { transform: translate(3px, 2px) rotate(0deg); }
  40% { transform: translate(1px, -1px) rotate(1deg); }
  50% { transform: translate(-1px, 2px) rotate(-1deg); }
  60% { transform: translate(-3px, 1px) rotate(0deg); }
  70% { transform: translate(3px, 1px) rotate(-1deg); }
  80% { transform: translate(-1px, -1px) rotate(1deg); }
  90% { transform: translate(1px, 2px) rotate(0deg); }
  100% { transform: translate(1px, -2px) rotate(-1deg); }
}
</style>
