<!doctype html>
<meta charset="UTF-8" />
<title>Work Along With Me</title>

<div id="profileBar">
  <img id="profilePicture" src="{{ user.picture }}" alt="Profile picture" />
  <h1>{{ user.username }}</h1>
</div>

<div class="screen-frame"></div>

<div id="profileButtons">
  <button onclick="location.href = '/home'">Home</button>
  <button id="friendButton"></button>
  <button id="blockButton">Block</button>
</div>

<dialog id="blockDialog">
  <p>
    Are you sure you want to block <strong>{{ user.username }}</strong>?
    This removes them as a friend and deletes any friend requests between you.
  </p>
  <button id="confirmBlock">Block</button>
  <button id="cancelBlock">Cancel</button>
</dialog>

<script>
  const user = {{ user|tojson }};
  const friendButton = document.getElementById("friendButton");

  // Friend button depends on how you relate to them (same rules as the search on /connections)
  const showRelationship = relationship => {
    user.relationship = relationship;
    friendButton.disabled = relationship === "request_sent" || relationship === "friends";
    friendButton.textContent = {
      none: "Add friend",
      request_received: "Accept request",
      request_sent: "Request pending",
      friends: "Friends",
    }[relationship];
  };

  friendButton.onclick = async () => {
    const url = user.relationship === "request_received"
      ? `/friends/requests/${user.id}/accept`
      : `/friends/requests/${user.id}`;
    const response = await fetch(url, { method: "POST" });
    if (!response.ok) {
      alert(await response.text());
      return;
    }
    showRelationship(user.relationship === "request_received" ? "friends" : (await response.json()).relationship);
  };

  showRelationship(user.relationship);

  // Blocking: confirm first, then leave (you can't view someone you've blocked)
  const blockDialog = document.getElementById("blockDialog");
  document.getElementById("blockButton").onclick = () => blockDialog.showModal();
  document.getElementById("cancelBlock").onclick = () => blockDialog.close();
  document.getElementById("confirmBlock").onclick = async () => {
    blockDialog.close();
    const response = await fetch(`/blocks/${user.id}`, { method: "POST" });
    if (!response.ok) {
      alert(await response.text());
      return;
    }
    location.href = "/home";
  };
</script>

<style>
  body {
    background-color: #d6b65e;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    margin-top: 50px;
  }

  h1 {
    font-size: 36px;
    margin-bottom: 20px;
    margin-left: 500px;
  }

  button {
    background-color: rgb(107, 204, 236);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    border-radius: 16px;
  }

  #profileBar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-left: 60px;
  }

  #profilePicture {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
  }

  #profileButtons {
    display: flex;
    justify-content: right;
    gap: 20px;
    align-items: right;
    margin-right: 100px;
  }

  .screen-frame {
    position: fixed;
    inset: 4px;
    border: 4px solid rgb(35, 105, 246);
    border-radius: 8px;
    pointer-events: none;      /* lets you still click the things underneath */
    box-sizing: border-box;
  }
</style>
