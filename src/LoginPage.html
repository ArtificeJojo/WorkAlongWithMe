<!DOCTYPE html>
<html lang="en">
    <Title>Login</Title>
    <style>
        body {
            background-color: #ded782;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 200px;
        }

        input {
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 200px;
        }

        h1, p {
            color: #333;
        }


    </style>
    <body>
        <h1>Login</h1>
        <p>Enter User Credentials:</p>

        <a href="index.html">
             <button id="loginButton">Login</button>
        </a>
       

        <p>No account? Create one now!</p>
        <a href="CreateAccount.html">
            <button id="createAccButton">Create Account</button>
        </a>
    </body>
</html>
