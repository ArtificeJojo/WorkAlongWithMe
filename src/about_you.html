<!doctype html>
<meta charset="UTF-8" />
<title>Work Along With Me</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">


<h1>Tell us more about yourself!</h1>

{# Fields are pre-filled with anything the user has answered before #}
<form method="post" action="/aboutyou">
  <fieldset id="aboutField" class="card">
    <legend>About you</legend>

    <div class="field-row">
      <label for="username">Username</label>
      <input id="username" name="username" required value="{{ about_you.display_name or '' }}" />
    </div>

    <div class="field-row">
      <label for="organization">Organization</label>
      <input id="organization" name="organization" required value="{{ about_you.organization or '' }}" />
    </div>
  </fieldset>

  {# Any skill can be typed; skills.txt only feeds the dropdown. The picker (/js/skills.js) adds a hidden "skills" input per skill #}
  <fieldset id="skillsField" class="card">
    <legend>Technical skills: list 1 to {{ max_skills }}</legend>
  </fieldset>


  <button type="submit">Continue</button>
</form>

<script src="/js/skills.js"></script>
<script>
  const picker = skillPicker(document.getElementById("skillsField"), {
    suggestions: {{ skill_suggestions|tojson }},
    max: {{ max_skills|tojson }},
    maxLength: {{ max_skill_length|tojson }},
    initial: {{ (about_you.skills or [])|list|tojson }},
    name: "skills",
  });

  // At least one skill is needed to continue
  document.querySelector("form").addEventListener("submit", event => {
    if (!picker.commit().length) {
      event.preventDefault();
      picker.error("Add at least one technical skill to continue.");
      picker.focus();
    }
  });
</script>

<style>
  body{
    background-image: url('/Images/bg.png');
    background-color: #181C4F;
    font-family: "Unknown Font", monospace;
  }

  h1{
    text-align: center;
    color: white;
  }

  form{
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 100px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* Shared card style for the About you and Technical skills boxes */
  .card {
    flex: 1 1 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    background-color: rgba(255, 255, 255, 0.85);
  }

  .card legend {
    padding: 0;
    font-weight: bold;
    float: left;
    width: 100%;
    margin-bottom: 8px;
  }

  /* Username / organization rows */
  .field-row {
    clear: both;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .field-row:last-child {
    margin-bottom: 0;
  }

  .field-row label {
    width: 110px;          /* keeps both inputs lined up */
    flex-shrink: 0;
  }

  .field-row input {
    flex: 1;
  }

  /* Make all text inputs look the same, including the skill box */
  .card input[type="text"],
  .field-row input {
    padding: 4px 8px;
    border: 1px solid #888;
    border-radius: 8px;
    font-family: inherit;
  }

  button{
    border-radius: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    button:hover { animation: none; }
  }

  button:hover{
    background-color: rgb(107, 204, 236);
    animation: shake 0.4s;
    transform:translateY(1px)
  }

  button:active{
    transform:translateY(-1px)
  }

@keyframes shake {
  0% { transform: translate(1px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -2px) rotate(-1deg); }
  20% { transform: translate(-3px, 0px) rotate(1deg); }
  30% { transform: translate(3px, 2px) rotate(0deg); }
  40% { transform: translate(1px, -1px) rotate(1deg); }
  50% { transform: translate(-1px, 2px) rotate(-1deg); }
  60% { transform: translate(-3px, 1px) rotate(0deg); }
  70% { transform: translate(3px, 1px) rotate(-1deg); }
  80% { transform: translate(-1px, -1px) rotate(1deg); }
  90% { transform: translate(1px, 2px) rotate(0deg); }
  100% { transform: translate(1px, -2px) rotate(-1deg); }
}
</style>
