<!doctype html>
<meta charset="UTF-8" />
<title>Work Along With Me</title>

<h1>Tell us more about yourself!</h1>

{# Fields are pre-filled with anything the user has answered before #}
<form method="post" action="/aboutyou">
  <label for="username">Username</label>
  <input id="username" name="username" required value="{{ about_you.display_name or '' }}" />

  <label for="organization">Organization</label>
  <input id="organization" name="organization" required value="{{ about_you.organization or '' }}" />

  <label for="track">Track</label>
  <select id="track" name="track" required>
    <option value="" disabled {% if not about_you.track %}selected{% endif %}>Choose a track</option>
    <option value="gators" {% if about_you.track == "gators" %}selected{% endif %}>The Gators</option>
    <option value="turtle" {% if about_you.track == "turtle" %}selected{% endif %}>The Turtle</option>
  </select>

  <button type="submit">Continue</button>
</form>

<p id="trackDescription"></p>

<script>
  // Placeholder descriptions for each track; replace with the real ones later
  const GATORS_DESCRIPTION = "Hello World!";
  const TURTLE_DESCRIPTION = "Goodbye World";

  const trackDescriptions = { gators: GATORS_DESCRIPTION, turtle: TURTLE_DESCRIPTION };
  const track = document.getElementById("track");
  const showDescription = () => {
    document.getElementById("trackDescription").textContent = trackDescriptions[track.value] || "";
  };

  track.onchange = showDescription;
  showDescription();
</script>

{% if quiz_prompt %}
  {# Shown once the form is submitted; the only way forward is the quiz #}
  <dialog id="quizPrompt">
    <h2>One more thing...</h2>
    <p>Before you can continue, you must take a <strong>"very serious"</strong> quiz.</p>
    <button onclick="location.href = '/quiz'">I accept</button>
  </dialog>

  <script>
    const quizPrompt = document.getElementById("quizPrompt");
    quizPrompt.oncancel = event => event.preventDefault();  // Escape can't dismiss it
    quizPrompt.showModal();
  </script>
{% endif %}

<style>
  body{
    background-image: url('/Images/bg.png');
    font-family: Arial, sans-serif;
  }

  h1{
    text-align: center;
    color: white;
  }

  form{
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 100px;
    justify-content: center;
  }
  button{
    border-radius: 16px;
  }

  #trackDescription {
    text-align: center;
    margin-top: 24px;
  }

  #quizPrompt {
    border: none;
    border-radius: 16px;
    padding: 24px 32px;
    text-align: center;
  }

  #quizPrompt::backdrop {
    background-color: rgba(0, 0, 0, 0.6);
  }

  #quizPrompt button {
    background-color: rgb(107, 204, 236);
    border: none;
    padding: 8px 20px;
    cursor: pointer;
  }

  button:hover{
    background-color: rgb(107, 204, 236);
    animation: shake 0.4s;
  }


@keyframes shake {
  0% { transform: translate(1px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -2px) rotate(-1deg); }
  20% { transform: translate(-3px, 0px) rotate(1deg); }
  30% { transform: translate(3px, 2px) rotate(0deg); }
  40% { transform: translate(1px, -1px) rotate(1deg); }
  50% { transform: translate(-1px, 2px) rotate(-1deg); }
  60% { transform: translate(-3px, 1px) rotate(0deg); }
  70% { transform: translate(3px, 1px) rotate(-1deg); }
  80% { transform: translate(-1px, -1px) rotate(1deg); }
  90% { transform: translate(1px, 2px) rotate(0deg); }
  100% { transform: translate(1px, -2px) rotate(-1deg); }
}
</style>
