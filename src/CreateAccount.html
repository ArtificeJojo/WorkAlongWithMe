<!DOCTYPE html>
<html lang="en">
    <title>Create Account</title>
    <style>
        body {
            background-color: #ded782;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 200px;
        }

        input {
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 200px;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
    <body>
        <input type="email" id="newEmail" placeholder="Enter your email">
        <input type="text" id="newUsername" placeholder="Enter your new username">
        <input type="password" id="newPassword" placeholder="Enter your new password">
        <button id="createAccountButton">Create Account</button>
        
    </body>
</html>
