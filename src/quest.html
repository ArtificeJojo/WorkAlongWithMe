<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Work Along With Me: Quest</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet" />


<script src="/js/pixel.js?v=7"></script>
<script src="/js/sfx.js?v=4"></script>
<script src="/js/music.js?v=5"></script>
<style>
  /* Same colours as the rest of the site; only the scenery behind is the quest's own */
  :root {
    --ink: #222; --panel: rgba(255, 255, 255, 0.92); --muted: #555; --button: rgb(107, 204, 236); --frame: rgb(35, 105, 246);
    --focus: #1f5fd6; --chip: #e6f6fc; --highlight: #ffe066; --tag: var(--frame); --sun-y: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); font-size: 18px; line-height: 1.45; background: #1f1a3d; }
  .screenframe { position: fixed; inset: 6px; z-index: 6; border: 4px solid var(--frame); border-radius: 16px; pointer-events: none; }
  body.pond { background: #7ec8f0; }

  /* ---------- the scenic world (decorative, behind everything) ---------- */
  #world { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  #world svg { width: 100%; height: 100%; display: block; }
  #sun { transform: translateY(var(--sun-y)); transition: transform 1.8s cubic-bezier(.45,0,.3,1); }
  .shimmer { animation: shimmer 2.4s ease-in-out infinite; }
  .shimmer.d2 { animation-delay: .6s; } .shimmer.d3 { animation-delay: 1.2s; }
  @keyframes shimmer { 0%,100% { opacity: .9 } 50% { opacity: .25 } }
  .firefly { animation: firefly 4s ease-in-out infinite; }
  @keyframes firefly { 0%,100% { transform: translate(0,0); opacity: .2 } 25% { opacity: 1 } 50% { transform: translate(6px,-5px); opacity: .5 } 75% { opacity: 1; transform: translate(-4px,-8px) } }
  .cloud { animation: drift 60s linear infinite; }
  .cloud.slow { animation-duration: 90s; }
  @keyframes drift { from { transform: translateX(-60px) } to { transform: translateX(380px) } }
  .fly { animation: flit 5s ease-in-out infinite; }
  /* Floating code blocks (swamp) and message bottles (pond): they sink away as the journey goes on */
  .float { animation: bob 2.4s steps(2) infinite; transition: opacity 1.2s steps(6), transform 1.2s steps(6); }
  .float:nth-child(2n) { animation-duration: 3s; animation-delay: .4s; }
  .float:nth-child(3n) { animation-duration: 2.7s; animation-delay: .9s; }
  .float.sunk { opacity: 0; animation: none; transform: translateY(6px); }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(1px) } }
  @keyframes flit { 0%,100% { transform: translate(0,0) } 30% { transform: translate(18px,-8px) } 60% { transform: translate(-10px,-14px) } }

  /* ---------- layout ---------- */
  #ui { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; max-width: 980px; margin: 0 auto; padding: 12px 16px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 1.4rem; color: white; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font: inherit; font-size: 1rem; background: var(--button); color: var(--ink); border: none; border-radius: 16px; padding: 6px 14px; display: inline-flex; gap: 6px; align-items: center; min-height: 40px; cursor: pointer; text-decoration: none; }
  .pill:hover { animation: shake 0.4s; }
  .pill input { width: 20px; height: 20px; }
  .pill[aria-pressed="false"] { opacity: .75; }

  /* journey map */
  .map { position: relative; margin: 14px 4px 0; height: 74px; }
  .map .trail { position: absolute; left: 22px; right: 22px; top: 50px; border-top: 5px dashed rgba(255,253,246,.85); }
  .map .stops { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: flex-end; }
  .map .stop { width: 44px; height: 44px; border-radius: 12px; background: var(--panel); display: grid; place-items: center; font-size: 1.3rem; }
  .map .stop:last-child { font-size: .85rem; }
  .map .stop.done { background: var(--highlight); }
  .map .stop.now { outline: 4px solid var(--frame); outline-offset: 2px; }
  .map .traveler { position: absolute; top: -4px; width: 44px; transform: translateX(-50%); transition: left 1s cubic-bezier(.4,1.4,.5,1); }

  /* stage: the character lives here, standing in the world */
  .stage { position: relative; flex: 1 1 auto; min-height: clamp(190px, 34vh, 340px); }
  #actor { position: absolute; left: 3%; bottom: -6px; transform-origin: 50% 100%; }
  #actor.submerged { transform: translateY(115%); opacity: 0; }
  #actor.leap { animation: leap 1.2s cubic-bezier(.25,.7,.35,1) forwards; }
  /* squash and stretch: stretched tall on the way up, squashed flat on landing */
  @keyframes leap { 0% { transform: translateY(115%) scale(.85,1.2); opacity: 0 } 12% { opacity: 1 } 38% { transform: translateY(-30%) scale(.9,1.14) rotate(-6deg) } 55% { transform: translateY(-36%) scale(1,1) rotate(2deg) } 76% { transform: translateY(0) scale(1.18,.82) rotate(0) } 88% { transform: translateY(-5%) scale(.95,1.06) } 100% { transform: translateY(0) scale(1,1) } }
  #actor.offstage { transform: translateX(160%); }
  #actor.swimin { animation: swimin 2.6s cubic-bezier(.3,.6,.4,1) forwards; }
  @keyframes swimin { 0% { transform: translateX(160%) translateY(0) rotate(0) } 20% { transform: translateX(118%) translateY(-4%) rotate(-3deg) } 40% { transform: translateX(76%) translateY(0) rotate(2deg) } 60% { transform: translateX(38%) translateY(-4%) rotate(-3deg) } 80% { transform: translateX(10%) translateY(0) rotate(1deg) } 92% { transform: translateX(-2%) scale(1.04,.96) } 100% { transform: translateX(0) translateY(0) scale(1,1) } }
  #prop { position: absolute; right: 5%; bottom: 0; display: flex; align-items: flex-end; }
  #prop.fly .px-char, #prop.liftoff > * { transform: translateY(-160%) scale(.4); opacity: 0; transition: transform 1s cubic-bezier(.5,-.4,.7,.6), opacity 1s ease-in; }
  .bubble-dot { position: absolute; width: 14px; height: 14px; border: 3px solid var(--ink); background: radial-gradient(circle at 35% 35%, #fff 0 25%, #bfefff 30%); border-radius: 50%; animation: rise 1.4s ease-out forwards; }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 1 } 50% { transform: translate(6px,-45px) scale(1) } 100% { transform: translate(-4px,-95px) scale(1.2); opacity: 0 } }
  .drop { position: absolute; width: 14px; height: 18px; background: #9fe2ff; border: 3px solid var(--ink); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation: splash .9s cubic-bezier(.2,.6,.5,1) forwards; }
  @keyframes splash { 0% { transform: translate(0,0) scale(.4) } 50% { transform: translate(calc(var(--dx) * .6), var(--dy)) scale(1) } 100% { transform: translate(var(--dx), 40px) scale(.6); opacity: 0 } }
  .ring { position: absolute; width: 60px; height: 16px; border: 4px solid #e8fbff; border-radius: 50%; transform: translateX(-50%) scale(.3); animation: ring 1s ease-out forwards; }
  @keyframes ring { to { transform: translateX(-50%) scale(4); opacity: 0 } }
  #prop .px-char { animation-name: px-pop, px-wobble; animation-duration: .6s, 1.1s; animation-iteration-count: 1, infinite; animation-delay: 0s, .6s; }

  /* dialogue box, like a story game */
  .dialog { position: relative; background: var(--panel); border: 4px solid var(--frame); border-radius: 16px; padding: 22px 18px 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); max-height: 62vh; overflow: auto; }
  .name-tag { position: absolute; z-index: 2; top: -16px; left: 18px; background: var(--tag); color: #fff; font-weight: bold; letter-spacing: .06em; text-transform: uppercase; padding: 4px 14px; border-radius: 16px; font-size: .95rem; }
  .dialog-wrap { position: relative; margin-top: 18px; }
  .scene-title { margin: 0 0 6px; font-size: 1.05rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .line { margin: 0; font-size: 1.3rem; font-weight: 500; min-height: 2.6em; }
  /* karaoke captions: words already said in full ink, the current word highlighted, the rest lighter */
  .line.karaoke .w { color: #8a8798; transition: color .15s; }
  .line.karaoke .w.said { color: var(--ink); }
  .line.karaoke .w.now { color: var(--ink); background: #fff1a8; border-radius: 6px; box-shadow: 0 0 0 3px #fff1a8; }
  /* MEGA-BUG's villain moment */
  #world svg { transition: filter 1s ease; }
  body.boss #world svg { filter: brightness(.55) saturate(1.4) hue-rotate(-25deg); }
  body.boss #world::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 75% 60%, rgba(200, 60, 220, .25), rgba(30, 0, 40, .55) 70%); animation: bosspulse 2.4s ease-in-out infinite; }
  @keyframes bosspulse { 0%,100% { opacity: .85 } 50% { opacity: 1 } }
  .name-tag.evil { background: #7a1f8f; transform: rotate(3deg) scale(1.08); }
  .btn.evil { background: #b14fc5; color: #fff; font-weight: bold; }
  #prop.bossrise { animation: bossrise 1.1s cubic-bezier(.2,.8,.3,1.2) both; }
  @keyframes bossrise { 0% { transform: translateY(120%) scale(.8,1.2) } 70% { transform: translateY(-8%) scale(1.08,.94) } 100% { transform: none } }
  #prop.taunt .px-char { animation: taunt .6s ease-in-out 2; }
  @keyframes taunt { 0%,100% { transform: scale(1) } 30% { transform: scale(1.12) rotate(-4deg) } 60% { transform: scale(1.08) rotate(4deg) } }
  #actor.scared .px-char { animation: scared .18s linear infinite !important; }
  @keyframes scared { 0%,100% { transform: translateX(0) } 50% { transform: translateX(-3px) } }
  .name-tag, .scene-title { font-family: "Silkscreen", "Courier New", monospace; }
  .name-tag { border-radius: 2px !important; box-shadow: 3px 3px 0 rgba(0,0,0,.35); }
  /* ---------- story cutscenes in the middle of the stage ---------- */
  #vis { position: absolute; left: 50%; bottom: 0; width: min(46vw, 400px); height: 100%; transform: translateX(-46%); transform-origin: 50% 100%; pointer-events: none; z-index: 1; }
  @media (max-width: 700px) { #vis { transform: translateX(-40%) scale(.62); } }
  #vis .pc { position: absolute; }
  #vis svg { display: block; image-rendering: pixelated; }
  #vis.show .pop-in { animation: v-pop .5s steps(5) both; }
  #vis .drop-in { animation: v-drop .5s steps(5) both; }
  @keyframes v-pop { 0% { transform: scale(0); opacity: 0 } 70% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes v-drop { 0% { transform: translateY(-120px); opacity: 0 } 80% { transform: translateY(6px); opacity: 1 } 100% { transform: none; opacity: 1 } }
  .hammering { transform-origin: 80% 90%; animation: v-hammer .4s steps(2) infinite; }
  @keyframes v-hammer { 0%,100% { transform: rotate(-35deg) } 50% { transform: rotate(10deg) } }
  .paint { width: 14px; height: 40px; transform-origin: top; animation: v-paint .4s steps(4) both; }
  @keyframes v-paint { from { transform: scaleY(0) } to { transform: scaleY(1) } }
  .brushing { animation: v-brush 1.4s steps(7) infinite; }
  @keyframes v-brush { 0%,100% { transform: translateX(0) } 50% { transform: translateX(110px) } }
  .scanning { animation: v-scan 1.6s steps(8) infinite; }
  @keyframes v-scan { 0%,100% { transform: translate(0,0) } 33% { transform: translate(40px,-14px) } 66% { transform: translate(20px,10px) } }
  .pulse { animation: v-pulse .6s steps(3) infinite; }
  @keyframes v-pulse { 0%,100% { opacity: .2; transform: scale(.7) } 50% { opacity: 1; transform: scale(1.1) } }
  .wave-flag { animation: v-flag .5s steps(2) infinite; transform-origin: 0 100%; }
  @keyframes v-flag { 50% { transform: skewY(-6deg) } }
  .follow { animation: v-follow 1s steps(4) infinite; }
  @keyframes v-follow { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  .sail { position: absolute; inset: 0; animation: v-sail 2s steps(16) both; }
  @keyframes v-sail { 0% { transform: translateX(-130%) } 80% { transform: translateX(4%) } 100% { transform: none } }
  .sail.docked { animation: v-bob 1.6s steps(2) infinite; }
  @keyframes v-bob { 50% { transform: translateY(3px) } }
  .unroll { transform-origin: left; animation: v-unroll .8s steps(8) both; }
  @keyframes v-unroll { from { transform: scaleX(.1) } to { transform: scaleX(1) } }
  .water-gap { position: absolute; left: 14%; right: 14%; bottom: 0; height: 22%; background: repeating-linear-gradient(90deg, #4a6aa0 0 8px, #3f5d90 8px 16px); }
  .countdown { font: bold 42px "Silkscreen", monospace; color: #fff; text-shadow: 3px 3px 0 #1b1f1a; }
  .flash-in { animation: v-flash .5s steps(3) both; }
  @keyframes v-flash { 0% { opacity: 0; filter: brightness(3) } 100% { opacity: 1; filter: none } }
  .swing-in { transform-origin: left top; animation: v-swing 1.2s steps(8) both; }
  @keyframes v-swing { 0% { transform: rotate(80deg) } 70% { transform: rotate(-8deg) } 100% { transform: none } }
  .gate-door { transition: transform 1.2s steps(8); }
  .gate-door.open { transform: translateY(-70%); }
  .gate-door svg { width: 70px; height: 80px; }
  .hint-note { background: #fff4d6; border: 3px solid #1b1f1a; padding: 4px 8px; font: 12px "Silkscreen", monospace; max-width: 150px; box-shadow: 3px 3px 0 #1b1f1a; }
  .hint-diagram, .hint-demo { background: rgba(255,255,255,.92); border: 3px solid #1b1f1a; padding: 2px 8px; font-size: 20px; white-space: nowrap; }
  .hint-diagram span { color: #e64980; } .hint-diagram span:nth-child(2n) { color: #4c6ef5; }
  .hint-demo span { display: inline-block; animation: v-tap .5s steps(2) both; }
  @keyframes v-tap { 0% { transform: scale(.4); opacity: .2 } 100% { transform: scale(1.2); opacity: 1; color: #e64980 } }
  .hatch { animation: v-hatch .6s steps(3) .4s both; }
  @keyframes v-hatch { to { transform: translateX(70px) } }
  .rocket-up { animation: v-launch 2.6s steps(20) .9s both; }
  @keyframes v-launch { 0% { transform: translateY(0) } 15% { transform: translateY(-40px) } 100% { transform: translateY(-110vh) } }
  .rocket-up .flame { margin-left: 18px; animation: flick .1s steps(2) infinite; }
  .puff { animation: v-puff 1.6s steps(8) both; }
  @keyframes v-puff { 0% { transform: scale(.3); opacity: 0 } 30% { opacity: 1 } 100% { transform: scale(2) translateY(-30px); opacity: 0 } }
  .app { width: min(42vw, 320px); background: #fffbea; border: 4px solid #1b1f1a; box-shadow: 4px 4px 0 #1b1f1a; font-size: 12px; color: #222; }
  .app-bar { background: #2f9e44; color: #fff; font: 13px "Silkscreen", monospace; padding: 4px 8px; }
  .app-post { display: flex; gap: 6px; align-items: center; padding: 5px 8px; border-top: 2px solid #e9e1c6; animation: v-pop .4s steps(4) both; }
  .app-post span { flex: 1; } .app-post em { font-style: normal; font-weight: bold; }
  .app-post.a1 { animation-delay: .4s } .app-post.a2 { animation-delay: 1.4s } .app-post.a3 { animation-delay: 2.6s; background: #d3f9d8 }
  .heart { color: #e03131; animation: v-pulse .8s steps(3) 1s infinite; }
  .join { background: #ffd43b; padding: 1px 5px; border: 2px solid #1b1f1a; }
  /* MEGA-BUG gobbling, getting zapped, and running away */
  .gobbled { animation: v-gobble 1.2s steps(8) both; }
  @keyframes v-gobble { 0% { transform: none; opacity: 1 } 90% { opacity: 1 } 100% { transform: translateX(min(40vw, 320px)) scale(.2) rotate(180deg); opacity: 0 } }
  #prop { transition: transform .8s steps(6); transform-origin: 50% 100%; }
  #prop.gorged { transform: scale(1.3); }
  #prop.zapped .px-char { animation: v-zap .12s steps(2) infinite !important; filter: brightness(2.2) saturate(.3); }
  @keyframes v-zap { 50% { transform: translateX(-6px) } }
  #prop.runaway { transform: translateX(160%); transition: transform 1.6s steps(12); }
  .beam { position: absolute; bottom: 30%; height: 22px; right: 12%; transform-origin: left; animation: v-beam 1s steps(6) both;
          background: repeating-linear-gradient(90deg, #fff3bf 0 8px, #66d9e8 8px 16px, #fff 16px 24px); border: 3px solid #1b1f1a; box-shadow: 0 0 18px #66d9e8; z-index: 2; }
  @keyframes v-beam { 0% { transform: scaleX(0) } 40% { transform: scaleX(1) } 80% { opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
  .scissors { position: absolute; left: 20%; top: 20%; z-index: 2; animation: v-snip 1.2s steps(6) both; }
  .scissors svg { width: 84px; height: 84px; image-rendering: pixelated; }
  @keyframes v-snip { 0% { transform: translate(-80px,-60px) rotate(-30deg); opacity: 0 } 30% { opacity: 1 } 50% { transform: translate(0,0) rotate(0) } 65% { transform: rotate(-20deg) } 80% { transform: rotate(0) } 100% { transform: translate(60px,40px) rotate(20deg); opacity: 0 } }
  .sweat { position: absolute; top: 4%; animation: v-sweat .9s steps(4) infinite; }
  .sweat svg { width: 16px; height: 22px; }
  @keyframes v-sweat { 0% { transform: translateY(0); opacity: 1 } 100% { transform: translateY(30px); opacity: 0 } }
  /* the gate puzzle in the dialogue box */
  .puzzle { margin-top: 12px; padding: 10px 12px; border: 2px dashed #868e96; border-radius: 10px; }
  .puzzle-q { margin: 0 0 8px; } .pattern { font-size: 1.4rem; letter-spacing: .25em; }
  .puzzle-a { display: flex; gap: 8px; flex-wrap: wrap; }
  .puzzle-a .btn.right { background: #8ce99a; }
  body.calm #vis *, body.calm .beam, body.calm .scissors { animation: none !important; }
  /* Chomp's lily pad */
  #pad { position: absolute; left: calc(3% - 2%); bottom: -18px; z-index: 0; animation: padbob 2.4s steps(2) infinite; }
  #pad svg { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  #pad.land { animation: padland .5s steps(5); }
  @keyframes padbob { 50% { transform: translateY(2px) } }
  @keyframes padland { 0% { transform: scale(1,1) } 30% { transform: scale(1.12,.6) translateY(6px) } 70% { transform: scale(.96,1.1) } 100% { transform: none } }
  #actor { z-index: 1; }
  /* Ping Pond scenes */
  .bubble { display: inline-block; background: #fff; border: 3px solid #1b1f1a; padding: 2px 8px; font: 12px "Silkscreen", monospace; color: #1b1f1a; white-space: nowrap; box-shadow: 3px 3px 0 #1b1f1a; }
  .bubble.loud { background: #ffe3e3; } .bubble.calm { background: #d3f9d8; } .bubble.whisper { font-size: 10px; opacity: .85; font-style: italic; }
  .jumble { animation: v-jumble .6s steps(3) infinite; }
  @keyframes v-jumble { 0%,100% { transform: rotate(-12deg) } 50% { transform: rotate(12deg) translateY(-6px) } }
  .slide-right { animation: v-slide 1.2s steps(8) both; }
  @keyframes v-slide { from { transform: translateX(-60px) } to { transform: none } }
  .riddle-scroll { background: #fff4d6; border: 4px solid #8a5a3a; padding: 10px 14px; font: 15px "Silkscreen", monospace; color: #3b2a1c; box-shadow: 4px 4px 0 #1b1f1a; text-align: center; }
  .flip { animation: v-flip 2s steps(4) infinite; }
  @keyframes v-flip { 0%,40% { transform: rotate(0) } 50%,90% { transform: rotate(180deg) } 100% { transform: rotate(360deg) } }
  .pond-app { width: min(40vw, 280px); }
  .pond-app .map { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px; background: #d3f9d8; }
  .pond-app .map span { background: #fff; border: 2px solid #1b1f1a; padding: 2px 4px; font-size: 11px; }
  .pond-app .map .pin { background: #ffe066; animation: v-pulse 1s steps(2) infinite; }
  .pond-app .when { padding: 4px 8px; font-size: 11px; font-weight: bold; }
  .lily-note { background: #4fae5c; padding: 8px; border: 3px solid #1b1f1a; border-radius: 50%; }
  .name-tag.frog { background: #2f9e44; }
  body.storm #world svg { filter: brightness(.5) saturate(.6); transition: filter 1.2s; }
  body.storm #world::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(105deg, transparent 0 14px, rgba(200,220,255,.35) 14px 16px); animation: rain .35s steps(3) infinite; }
  body.storm #world::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: #fff; opacity: 0; animation: lightning 4.2s steps(1) infinite; }
  body.storm-ending #world::after { opacity: .3; transition: opacity 2s; }
  @keyframes rain { to { background-position: -24px 60px; } }
  @keyframes lightning { 0%, 7%, 11%, 100% { opacity: 0 } 5%, 9% { opacity: .55 } }
  .drift-l { animation: v-driftl 3s steps(6) infinite alternate; } .drift-r { animation: v-driftr 3s steps(6) infinite alternate; }
  @keyframes v-driftl { to { transform: translateX(14px) } } @keyframes v-driftr { to { transform: translateX(-14px) } }
  .flashbolt { animation: v-bolt 4.2s steps(1) infinite; }
  @keyframes v-bolt { 0%, 12%, 100% { opacity: 0 } 4%, 10% { opacity: 1 } }
  .shake { animation: v-shake .25s steps(2) infinite; }
  @keyframes v-shake { 50% { transform: translate(3px, -2px) rotate(2deg) } }
  .raise { animation: v-raise .8s steps(6) both; }
  @keyframes v-raise { from { transform: translateY(80px) } to { transform: none } }
  .surf-wave { animation: v-bob 1s steps(2) infinite; }
  #actor.tuck .px-char { transform: scale(.8, .55) translateY(20%) !important; transition: transform .6s steps(4); filter: brightness(.95); }
  #actor.surf .px-char { animation: v-surf 1.2s steps(6) infinite !important; }
  @keyframes v-surf { 0%,100% { transform: rotate(-8deg) translateY(0) } 50% { transform: rotate(8deg) translateY(-10%) } }
  #actor.spot::before { content: ""; position: absolute; left: -20%; right: -20%; bottom: 0; height: 160%; background: linear-gradient(to bottom, rgba(255,250,200,0), rgba(255,250,200,.55)); clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); pointer-events: none; }

<body>
<div id="world" aria-hidden="true"></div>
<div id="ui">
  <header>
    <h1 id="questName">Quest</h1>
    <div class="toggles">
      <button class="pill" id="voiceToggle" aria-pressed="true">Sound on</button>
      <button class="pill" id="musicToggle" aria-pressed="true">Music on</button>
      <label class="pill"><input type="checkbox" id="calmToggle" /> Calm mode</label>
      <a class="pill" href="/home">Home</a>
    </div>
  </header>
  <nav class="map" id="map" aria-label="Quest journey"></nav>
  <p class="sr-only" id="progressText" aria-live="polite"></p>
  <div class="stage" id="stage" aria-hidden="true"><div id="vis"></div><div id="pad"></div><div id="actor"></div><div id="prop"></div></div>
  <div class="dialog-wrap">
    <div class="name-tag" id="nameTag"></div>
    <section class="dialog" id="dialog" aria-labelledby="questName"></section>
  </div>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="screenframe" aria-hidden="true"></div>

<script>
  const DATA = {{ quests_json|safe }};
  const PROGRESS = {{ progress_json|safe }};
  const QUEST = DATA.quests["{{ quest_id }}"];
  const POND = QUEST.id === "turtle";

  // The first words, before the quest's own intro line: the "who, me?" moment.
  const HELLO = POND
    ? { line: "Oh... hello there. Sorry, I'm a little slow. I was hoping someone kind would come by.", button: "Hi, Ponder!" }
    : { line: "WHOA, hey! You! Yeah, YOU! You're the hero everyone's been talking about, right?! I NEED your help!", button: "Who, me?" };

  // Sound effects: when a scene opens, and for each choice (scene id, or "scene:value" for a specific choice).
  const SCENE_SFX = { mega_bug: "splash", rainstorm: "thunder", message_flood: "clink", frog_bug: "ribbit" };
  const CHOICE_SFX = {
    powers: "sparkle", workbench: "clunk",
    "mega_bug:bite_sized": "pops", "mega_bug:large": "boom",
    "launch_bridge:checkins": "planks", "launch_bridge:single_deadline": "whoosh", "launch_bridge:flexible": "boing",
    locked_gate: "unlock",
    message_flood: "clink", "slow_riddle:take_time": "tick", "slow_riddle:instant": "whoosh",
    frog_bug: "ribbit", rainstorm: "calm", pond_fair: "fanfare",
  };

  // ------------------------------------------------------------- settings (kept per browser)
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const calmToggle = document.getElementById("calmToggle");
  const voiceToggle = document.getElementById("voiceToggle");
  calmToggle.checked = store.get("wawm-calm") === "1";
  let voiceOn = store.get("wawm-voice") !== "0";  // controls the voice AND the sound effects
  const setVoiceButton = () => {
    voiceToggle.setAttribute("aria-pressed", String(voiceOn));
    voiceToggle.textContent = voiceOn ? "Sound on" : "Sound off";
    Sfx.enabled = voiceOn;
    if (window.Music) Music.enabled = voiceOn && musicOn;
  };
  const musicToggle = document.getElementById("musicToggle");
  let musicOn = store.get("wawm-music") !== "0";
  const setMusicButton = () => {
    musicToggle.setAttribute("aria-pressed", String(musicOn));
    musicToggle.textContent = musicOn ? "Music on" : "Music off";
    Music.enabled = voiceOn && musicOn;
  };
  musicToggle.addEventListener("click", () => { musicOn = !musicOn; store.set("wawm-music", musicOn ? "1" : "0"); setMusicButton(); });
  setVoiceButton();
  setMusicButton();

  document.body.classList.toggle("pond", POND);
  document.body.classList.toggle("calm", calmToggle.checked);
  document.getElementById("questName").textContent = QUEST.name;
  document.getElementById("nameTag").textContent = QUEST.guide;

  // ------------------------------------------------------------- voice
  // Picks a female English voice when the computer has one; Chomp is quick and bright, Ponder slow and calm.
  const FEMALE = /(aria|jenny|zira|samantha|ava|allison|susan|karen|moira|tessa|serena|michelle|emma|sonia|libby|google us english|google uk english female|female)/i;
  let chosenVoice = null;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    const voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    chosenVoice = voices.find(v => FEMALE.test(v.name) && /natural|online|neural/i.test(v.name))
      || voices.find(v => FEMALE.test(v.name)) || voices.find(v => /en-US/i.test(v.lang)) || voices[0] || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  const MALE = /(guy|david|mark|andrew|brian|eric|christopher|roger|steffan|daniel|alex|fred|google us english$|male)/i;
  let maleVoice = null;
  function pickMale() {
    if (!("speechSynthesis" in window)) return;
    const voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang) && !/female/i.test(v.name));
    maleVoice = voices.find(v => MALE.test(v.name) && /natural|online|neural/i.test(v.name)) || voices.find(v => MALE.test(v.name)) || null;
  }
  if ("speechSynthesis" in window) { pickMale(); speechSynthesis.addEventListener("voiceschanged", pickMale); }
  function speak(text, speaker = QUEST.character) {
    if (!voiceOn || !("speechSynthesis" in window)) return null;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (chosenVoice) u.voice = chosenVoice;
      if ((speaker === "chomp" || speaker === "megabug") && maleVoice) u.voice = maleVoice;
      const villain = speaker === "megabug";
      const frog = speaker === "freddie";
      const tiny = speaker === "tinybugs";
      u.rate = villain ? 0.9 : tiny ? 1.3 : frog ? 1.2 : POND ? 0.86 : 1.12;
      u.pitch = villain ? 0.1 : tiny ? 2 : frog ? 1.7 : POND ? 1.05 : 1.05;  // MEGA-BUG: as deep as the browser voice goes
      return u;  // the caller starts it, after hooking up lip-sync
    } catch { return null; }
  }

  // ------------------------------------------------------------- lip-sync
  // The mouth opens once per syllable of the word being said, and that word lights up (karaoke style).
  // It follows the voice's real word timing when the browser reports it, and otherwise an estimated pace,
  // so it also works with the sound off, for anyone reading instead of listening.
  const SYLLABLE_MS = POND ? 240 : 165;
  const syllables = w => Math.max(1, (w.toLowerCase().replace(/[^a-z]/g, "").replace(/e$/, "").match(/[aeiouy]+/g) || []).length);
  // Gemini-recorded voices (made once by flask/make_voices.py): "speaker|line" -> clip file.
  const VOICE_FILES = {};
  fetch("/audio/manifest.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : {}).then(m => Object.assign(VOICE_FILES, m)).catch(() => {});
  const clipFor = (speaker, text) => voiceOn && (VOICE_FILES._done || []).includes(speaker) && VOICE_FILES[`${speaker}|${text}`] ? `/audio/${VOICE_FILES[`${speaker}|${text}`]}` : null;
  const voiceAudio = new Audio();
  let audioCtx = null, analyser = null, levels = null, villainWet = null;
  function hookAnalyser() {
    // Reads how loud the voice is right now, so the mouth opens on the actual sound.
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaElementSource(voiceAudio);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
      src.connect(analyser); analyser.connect(audioCtx.destination);
      // MEGA-BUG's voice gets a big cavern echo.
      const echo = audioCtx.createDelay(); echo.delayTime.value = 0.16;
      const fb = audioCtx.createGain(); fb.gain.value = 0.38;
      villainWet = audioCtx.createGain(); villainWet.gain.value = 0;
      src.connect(echo); echo.connect(fb); fb.connect(echo); echo.connect(villainWet); villainWet.connect(audioCtx.destination);
      levels = new Float32Array(analyser.fftSize);
    } catch { analyser = null; }
  }
  const loudness = () => {
    if (!analyser) return null;
    analyser.getFloatTimeDomainData(levels);
    let sum = 0; for (const v of levels) sum += v * v;
    return Math.sqrt(sum / levels.length);
  };
  function stopVoices() {
    try { voiceAudio.pause(); } catch {}
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  }

  let talkToken = 0;
  // Buttons appear only once the character has finished talking (right away in calm mode).
  let talkActive = false, revealTimer = null;
  function revealButtons() {
    const hidden = [...dialog.querySelectorAll(".wait-talk")];
    if (!hidden.length) return;
    hidden.forEach(n => n.classList.remove("wait-talk"));
    if (!dialog.contains(document.activeElement)) {
      const target = dialog.querySelector(".choice") && hidden.some(n => n.classList.contains("choices"))
        ? dialog.querySelector(".choice") : [...dialog.querySelectorAll(".actions .btn:not(:disabled)")].pop();
      if (target) target.focus();
    }
  }
  function scheduleReveal(ms) {
    clearTimeout(revealTimer);
    revealTimer = setTimeout(() => { if (!talkActive) revealButtons(); }, ms);
  }
  function holdButtons() {
    if (calm()) return;
    talkActive = true; clearTimeout(revealTimer);
    dialog.querySelectorAll(".actions, .choices, .puzzle").forEach(n => n.classList.add("wait-talk"));
  }
  // who: the character object that talks (its mouth moves) and which voice it uses.
  function talk(text, lineEl, mood = "talk", who = null, onDone = null) {
    const speaker = who ? who.speaker : QUEST.character;
    const actor = who ? who.char : guideChar;
    const token = ++talkToken;
    if (!calm()) { talkActive = true; clearTimeout(revealTimer); dialog.querySelectorAll(".actions").forEach(n => n.classList.add("wait-talk")); }
    [guideChar, bug, frogChar].forEach(c => { if (c && c !== actor) { c.setMouth(null); c.setMood("idle"); } });
    const live = () => token === talkToken;
    let mouthTimers = [], paceTimer = null, done = false;
    const clearMouth = () => { mouthTimers.forEach(clearTimeout); mouthTimers = []; };
    // Split into words (spaces kept), each in its own span.
    const parts = text.split(/(\s+)/);
    const words = [];
    let pos = 0;
    lineEl.replaceChildren(...parts.map(part => {
      const span = document.createElement("span");
      span.textContent = part;
      if (/\S/.test(part)) { span.className = "w"; words.push({ span, text: part, start: pos }); }
      pos += part.length;
      return span;
    }));
    lineEl.classList.remove("karaoke");
    actor.setMouth(null);
    actor.setMood(mood);
    stopVoices();
    const clip = clipFor(speaker, text);
    const utter = clip ? null : speak(text, speaker);
    if (calm() || !words.length) {
      if (clip) { voiceAudio.src = clip; voiceAudio.play().catch(() => {}); }
      else if (utter) speechSynthesis.speak(utter);
      if (mood === "talk") actor.setMood("idle");
      talkActive = false; scheduleReveal(0);
      if (onDone) setTimeout(() => live() && onDone(), clip ? 2500 : 400);
      return;
    }
    lineEl.classList.add("karaoke");
    let current = -1;
    function sayWord(i, ms, mouth = true) {
      if (!live() || done || i <= current || i >= words.length) return;
      for (let k = Math.max(0, current); k < i; k++) words[k].span.className = "w said";
      current = i;
      words[i].span.className = "w now";
      if (!mouth) return;
      clearMouth();
      const n = syllables(words[i].text), per = ms / n;
      for (let k = 0; k < n; k++) {
        mouthTimers.push(setTimeout(() => live() && actor.setMouth(true), k * per));
        mouthTimers.push(setTimeout(() => live() && actor.setMouth(false), k * per + per * 0.6));
      }
    }
    const wordMs = i => syllables(words[i].text) * SYLLABLE_MS;
    const pauseAfter = i => /[.!?…]$/.test(words[i].text) ? 320 : /[,;:]$/.test(words[i].text) ? 160 : 40;
    // Safety net: if a voice never reports that it ended, show the buttons anyway.
    setTimeout(() => { if (live() && !done) { talkActive = false; scheduleReveal(0); } }, 4000 + words.length * 700);
    function finish() {
      if (!live() || done) return;
      talkActive = false; scheduleReveal(450);
      done = true; clearMouth(); clearTimeout(paceTimer);
      words.forEach(w => { w.span.className = "w said"; });
      lineEl.classList.remove("karaoke");
      actor.setMouth(null);
      if (mood === "talk") actor.setMood("idle");
      if (onDone) setTimeout(() => live() && onDone(), 350);
    }
    // Estimated pace, used with no voice, or if the voice gives no word timing.
    function pace(i) {
      if (!live() || done) return;
      if (i >= words.length) { paceTimer = setTimeout(finish, 150); return; }
      sayWord(i, wordMs(i));
      paceTimer = setTimeout(() => pace(i + 1), wordMs(i) + pauseAfter(i));
    }
    actor.setMouth(false);
    if (clip) {
      // Gemini voice: the mouth follows the loudness of the voice, and the words light up in step with the clip.
      hookAnalyser();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      const weight = i => syllables(words[i].text) + (/[.!?…]$/.test(words[i].text) ? 2 : /[,;:]$/.test(words[i].text) ? 1 : 0);
      const weights = words.map((_, i) => weight(i));
      const total = weights.reduce((a, b) => a + b, 0);
      let open = false;
      const frame = () => {
        if (!live() || done) return;
        const d = voiceAudio.duration;
        if (d && isFinite(d)) {
          const goal = (voiceAudio.currentTime / d) * total;
          let acc = 0, i = 0;
          while (i < words.length - 1 && acc + weights[i] <= goal) acc += weights[i++];
          sayWord(i, 0, false);
        }
        const level = loudness();
        const nowOpen = level == null ? Math.floor(voiceAudio.currentTime * 7) % 2 === 0 : level > (open ? 0.025 : 0.045);
        if (nowOpen !== open) { open = nowOpen; actor.setMouth(open); }
        requestAnimationFrame(frame);
      };
      voiceAudio.onended = () => { if (live()) finish(); };
      voiceAudio.onerror = () => { if (live() && current < 0) pace(0); };
      voiceAudio.src = clip;
      const villain = speaker === "megabug";
      voiceAudio.preservesPitch = !villain; voiceAudio.mozPreservesPitch = !villain; voiceAudio.webkitPreservesPitch = !villain;
      const tiny = speaker === "tinybugs";
      voiceAudio.preservesPitch = !(villain || tiny); voiceAudio.mozPreservesPitch = !(villain || tiny); voiceAudio.webkitPreservesPitch = !(villain || tiny);
      voiceAudio.playbackRate = villain ? 0.86 : tiny ? 1.4 : 1;

      if (speaker === "tinybugs" && !calm()) {
        [[0.06, 1.1], [0.12, 0.95], [0.18, 1.2], [0.25, 1.05]].forEach(([delay, rate]) => {
          const extra = new Audio(clip);
          extra.preservesPitch = false; extra.mozPreservesPitch = false; extra.webkitPreservesPitch = false;
          extra.playbackRate = rate * 1.4; extra.volume = 0.5;
          setTimeout(() => extra.play().catch(() => {}), delay * 1000);
        });
      }
      voiceAudio.play().then(() => requestAnimationFrame(frame)).catch(() => { if (live()) pace(0); });
      return;
    }
    if (!utter) { pace(0); return; }
    let gotBoundary = false;
    utter.onboundary = e => {
      if (!live() || (e.name && e.name !== "word")) return;
      gotBoundary = true; clearTimeout(paceTimer);
      let i = 0;
      while (i + 1 < words.length && words[i + 1].start <= e.charIndex) i++;

    utter.onend = () => { if (live()) finish(); };
    utter.onerror = () => { if (live() && !gotBoundary) pace(Math.max(0, current + 1)); };
    utter.onstart = () => {
      // Some voices never report word timing: fall back to the estimated pace if none arrives quickly.
      paceTimer = setTimeout(() => { if (live() && !gotBoundary) pace(0); }, 450);
    };

    setTimeout(() => { if (live() && current < 0 && !gotBoundary && !done) pace(0); }, 1200);

  }

  // ------------------------------------------------------------- the world
  // A blocky voxel world: textured blocks on a heightmap, so every tree stands on a hill block.
  function drawWorld() {
    const R = (x, y, w, h, c, cls = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"${cls ? ` class="${cls}"` : ""}/>`;
    const hash = (x, y, s = 1) => { let h = (x * 374761393 + y * 668265263 + s * 974711) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
    const B = 8, P = 2;           // block size, texture pixel size
    const WATER = 122;            // top of the water
    // A textured block: base color plus speckles on a 4x4 texture grid.
    const block = (x, y, base, spk, amount = 0.3, s = 1) => {
      let out = R(x, y, B, B, base);
      for (let j = 0; j < B / P; j++) for (let i = 0; i < B / P; i++) {
        const r = hash(x / P + i, y / P + j, s);
        if (r < amount) out += R(x + i * P, y + j * P, P, P, spk[Math.floor(r * 97) % spk.length]);
      }
      return out;
    };
    // A grass block's side: green top strip with drips, dirt below.
    const grassBlock = (x, y, g) => {
      let out = block(x, y, g.dirt, g.dirtSpk, 0.35, 2) + R(x, y, B, P, g.grass) + R(x, y + P, B, P, g.grass);
      for (let i = 0; i < B / P; i++) if (hash(x + i, y, 3) < 0.5) out += R(x + i * P, y + 2 * P, P, P, g.grass);
      return out + R(x, y, B, 1, g.grassLight);

    // A hill: columns of blocks standing on the shoreline, `heights` in blocks, one per column.
    const hill = (x0, heights, g, top = WATER) => {
      let out = "";

        const x = x0 + i * B;

  function showBridge(how) {
    // Two banks with the swamp between them; the launch pad waits on the far side.
    const N = 7, start = 21, span = 58;
    const plank = (k, cls, delay, sag = 0) =>
      `<div class="plank ${cls}" style="left:${start + k * span / N}%;width:${span / N - 0.6}%;bottom:${62 - sag}px;animation-delay:${delay}s"></div>`;
    let deck = "", walkDelay = null;
    if (how === "single_deadline") {
      deck = `<div class="pc countdown" style="left:44%;bottom:130px">3</div>` + Array.from({ length: N }, (_, k) => plank(k, "flash-in", 1.8)).join("");
      walkDelay = 2.4;
    } else if (how === "checkins") {
      deck = Array.from({ length: N }, (_, k) => plank(k, "drop-in", 0.2 + k * 0.45) +
        `<div class="pc pop-in" style="left:${start + k * span / N + 1}%;bottom:92px;animation-delay:${0.45 + k * 0.45}s">${ART.tick}</div>`).join("");
      walkDelay = 0.6 + N * 0.45;
    } else if (how === "flexible") {
      const sag = k => Math.round(Math.sin(((k + 0.5) / N) * Math.PI) * 12);
      deck = `<div class="rope-bridge swing-in">` + Array.from({ length: N }, (_, k) => plank(k, "", 0, sag(k))).join("") +
        `<div class="rope" style="left:${start}%;width:${span}%"></div></div>`;
      walkDelay = 1.5;
    }
    const walker = walkDelay == null ? "" :
      `<div class="pc walker" style="bottom:70px;animation-delay:${walkDelay}s">${Pixel.svgFor(Pixel.sprites.chomp({}), 58, "").outerHTML}</div>`;

      `<div class="pc" style="right:4%;bottom:70px">${ART.pad}</div>${deck}${walker}`, "show");

    const chompSays = { speaker: QUEST.character, char: guideChar };
    const beats = [
      { who: "chomp", text: DARK, button: "Uh oh...", go: () => { document.body.classList.add("boss"); Sfx.play("thunder"); actorEl.classList.add("scared"); Music.play("suspense"); } },
      { who: "bug", text: BOSS_LINES[0], button: "Who ARE you?!", go: () => { propEl.className = calm() ? "" : "bossrise"; mountBug(); Sfx.play("splash"); Music.play("evil"); Music.cackle(); } },
      { who: "bug", text: BOSS_LINES[1], button: "Wait, what are you doing?!" },
      { who: "bug", text: BOSS_LINES[2], button: "Chomp?!", go: () => { showGobble(); Music.gobble(); } },
      { who: "chomp", text: CODE_HARDER, button: "Did it work?!", go: () => { overwhelm(true); codingFrenzy(); } },
      { who: "bug", text: TAUNT, button: "Oh no...", go: () => { Music.cackle(); } },
      { who: "chomp", text: OVERWHELM, button: "We can beat it together!", go: () => { overwhelm(true); clearVis(); } },
    ];
    const beat = n => {
      const b = beats[n];
      if (b.go) b.go();
      const evil = b.who === "bug";
      speakerTag(evil);
      const next = el("button", { class: evil ? "btn evil" : "btn", text: b.button, onclick: () => {
        Sfx.play("boom");
        if (n + 1 < beats.length) beat(n + 1);
        else { speakerTag(false); overwhelm(false); clearVis(); scene(i); }
      } });
      const line = el("p", { class: "line", "aria-live": "polite" });
      show(el("h2", { class: "scene-title", id: "sceneTitle", text: n === 0 ? "Something's wrong..." : "The Time Eater appears!" }), line,
        el("div", { class: "actions", style: "justify-content:flex-end" }, next));
      if (n === 1 || n === 3 || n === 5) holdButtons();
      if (n === 1) setTimeout(() => talk(b.text, line, "talk", { speaker: "megabug", char: bug }), 2600);
      else if (n === 3) setTimeout(() => talk(b.text, line, "talk", { speaker: "megabug", char: bug }), 2200);
      else if (n === 5) setTimeout(() => talk(b.text, line, "talk", { speaker: "megabug", char: bug }), 2700);
      if (n !== 1 && n !== 3 && n !== 5) talk(b.text, line, "talk", evil ? { speaker: "megabug", char: bug } : chompSays);
      if (evil && !calm()) { propEl.classList.remove("taunt"); void propEl.offsetWidth; propEl.classList.add("taunt"); }
      next.focus();
    };
    beat(0);
  }

  // The server gate puzzle: what comes next in the pattern?
  const PUZZLE_RIGHT = "YES! The tile clicks in, and the gate rumbles open! You cracked it!";
  const PUZZLE_WRONG = "Ooh, so close! Try another one. No rush!";

  function scene(i) {
    const s = QUEST.scenes[i];
    if (s.id === "mega_bug" && !bossDone) return bossFight(i);
    if (s.id === "frog_bug" && !lilyDone) return frogVisit(i);
    if (POND && FREDDIE_TURN[s.id] && !freddieDone.has(s.id)) return freddieTurn(i);
    step = i; renderProgress();
    speakerTag(false); actorEl.classList.remove("scared");
    if (s.id !== "mega_bug") { document.body.classList.remove("boss"); if (s.id !== "rainstorm") Music.play("calm"); }
    const keepFrog = POND && frogChar;
    if (!keepFrog) { propEl.className = ""; propEl.replaceChildren(); frogChar = null; }
    bug = null;
    clearVis();
    if (s.id !== "rainstorm") { document.body.classList.remove("storm"); Music.storm(false); }
    if (s.id === "message_flood") showMessages(null);
    if (s.id === "slow_riddle") showRiddle(null);
    if (POND && !frogChar) mountFrog();
    if (s.id === "rainstorm") startStorm();
    if (s.id === "pond_fair") showFair(null);
    if (s.id === "mega_bug") { mountBug(); if (!calm()) propEl.classList.add("gorged"); }
    if (s.id === "workbench") { showWorkbench(answers[s.field] || null); Sfx.play("swim"); }
    if (s.id === "launch_bridge") showBridge(null);
    if (s.id === "locked_gate") showGate(false);
    if (SCENE_SFX[s.id]) setTimeout(() => Sfx.play(SCENE_SFX[s.id]), 250);
    const line = say(s.line);
    const multi = s.multi || 0;
    let picked = multi ? [...(answers[s.field] || [])] : answers[s.field] ?? null;
    const next = el("button", { class: "btn", text: i + 1 < QUEST.scenes.length ? "Next" : "See what I learned", onclick: () => { Sfx.play("next"); advance(); } });
    next.disabled = multi ? false : picked == null;
    // The gate puzzle: the gate only opens once the pattern is solved (or the hero skips).
    let solved = false;
    let gateHint = null;
    const puzzle = s.id !== "locked_gate" ? null : el("div", { class: "puzzle" },
      el("p", { class: "puzzle-q dense", text: "Gate instructions: Examine the full sequence of tiles on the door, determine the rule that governs " +
        "how the tiles repeat, keeping in mind that every tile has two separate properties (its color and its shape) that may each " +
        "follow their own pattern, then select the one tile that continues both parts of the rule and place it in the empty slot." }),
      el("div", { class: "puzzle-a" }, [["red", "circle"], ["blue", "circle"], ["red", "tri"], ["blue", "tri"]].map(([color, shape]) => {
        const id = `${color}-${shape}`;
        const b = el("button", { class: "btn secondary tile-btn", "aria-label": `${color} ${shape === "tri" ? "triangle" : "circle"}` });
        b.innerHTML = tileHTML(color, shape) + `<span>${color} ${shape === "tri" ? "triangle" : "circle"}</span>`;
        b.addEventListener("click", () => {
          if (solved) return;
          showGate(false, gateHint, id);  // the tile goes into the slot...
          if (id === GATE_ANSWER) {
            solved = true; b.classList.add("right");
            Sfx.play("unlock");
            setTimeout(() => { showGate(true, null, id); Sfx.play("success"); }, calm() ? 0 : 700);  // ...and the gate swings open
            talk(PUZZLE_RIGHT, line, "celebrate");
            next.disabled = false;
          } else {
            Sfx.play("back");
            setTimeout(() => showGate(false, gateHint), calm() ? 0 : 700);  // ...and pops back out
            talk(PUZZLE_WRONG, line, "talk");
          }
        });
        return b;
      })));
    const riddle = s.id !== "slow_riddle" ? null : el("div", { class: "puzzle", hidden: "" },
      el("p", { class: "puzzle-q" }, el("strong", { text: "What has a neck, but no head?" })),
      el("div", { class: "puzzle-a" }, [["bottle", "🍾 A bottle"], ["turtle", "🐢 A turtle"], ["lily", "🌿 A lily pad"]].map(([v, label]) =>
        el("button", { class: "btn secondary", text: label, onclick: e => {
          if (solved) return;
          if (v === "bottle") {
            solved = true; e.target.classList.add("right");
            Sfx.play("success"); setVis(piece(ART.bottle, 40, 20, "pop-in") + piece(ART.sparkle, 30, 50, "pop-in", .2) + piece(ART.sparkle, 56, 40, "pop-in", .4), "show");
            talk(RIDDLE_RIGHT, line, "celebrate");
            next.disabled = false; next.focus();
          } else { Sfx.play("back"); talk(RIDDLE_WRONG, line, "talk"); }
        } }))));
    if (puzzle || riddle) next.disabled = !solved;

    const buttons = s.choices.map(c => {
      const b = el("button", { class: "choice", "aria-pressed": "false" },
        el("span", {}, el("span", { text: c.label }), EXAMPLES[`${s.id}:${c.value}`] ? el("small", { class: "example", text: EXAMPLES[`${s.id}:${c.value}`] }) : null));
      b.dataset.value = c.value;
      b.addEventListener("click", () => {
        if (multi) picked = picked.includes(c.value) ? picked.filter(v => v !== c.value) : (multi === 1 ? [c.value] : [...picked, c.value].slice(-multi));
        else picked = c.value;
        answers[s.field] = picked;
        sync();
        Sfx.play("select");
        setTimeout(() => Sfx.play(CHOICE_SFX[`${s.id}:${c.value}`] || CHOICE_SFX[s.id] || "select"), 120);
        cleanUp(i);
        if (s.id === "powers") showPower(c.value);
        if (s.id === "message_flood") showMessages(c.value);
        if (s.id === "slow_riddle") { showRiddle(c.value); riddle.hidden = false; }
        if (s.id === "rainstorm") calmStorm(c.value);
        if (s.id === "pond_fair") { showFair(c.value); actorEl.classList.toggle("spot", c.value === "lead"); }
        if (s.id === "workbench") showWorkbench(c.value);
        if (s.id === "launch_bridge") showBridge(c.value);
        if (s.id === "locked_gate") { gateHint = c.value; showGate(solved, c.value, solved ? GATE_ANSWER : null); }
        if (s.id === "mega_bug") showPlan(c.value);
        if (s.id === "mega_bug" && BOSS_DEFEAT[c.value]) {
          // Chomp attacks (energy blast or magic scissors), MEGA-BUG gets its last words, then runs away.
          mountBug(); propEl.className = "gorged";
          guideChar.setMood("celebrate");
          if (c.value === "large") {
            energyBlast();
            talk("Take THIS!", line, "celebrate");
            setTimeout(() => {
              propEl.className = "gorged zapped";
              speakerTag(true);
              talk(BOSS_DEFEAT.large, line, "talk", { speaker: "megabug", char: bug }, () => {
                speakerTag(false); document.body.classList.remove("boss"); Music.play("calm");
                propEl.className = "fly";
                talk(c.reaction, line, "celebrate");
              });
            }, calm() ? 0 : 1100);
          } else {
            // The scissors snip; the Time Eater surrenders in its deep voice, shrinks with a rising whoop,
            // and splits into five tiny bugs that squeak their last words together.
            magicScissors();
            talk("Snip snip!", line, "celebrate");
            setTimeout(() => {
              propEl.className = "gorged surrender";
              const flag = el("div", { class: "white-flag" }); flag.innerHTML = ART.breakflag; propEl.append(flag);
              speakerTag(true);
              talk(SURRENDER, line, "talk", { speaker: "megabug", char: bug }, () => {
                if (Music.shrink) Music.shrink();
                propEl.className = "shrinking";
                setTimeout(() => {
                  propEl.className = ""; bug = null;
                  Pixel.squad(propEl, { still: calm(), size: 54 });
                  Sfx.play("pops");
                  speakerTag("TINY BUGS");
                  const squadVoice = { speaker: "tinybugs", char: { setMouth() {}, setMood() {} } };
                  talk(BOSS_DEFEAT.bite_sized, line, "talk", squadVoice, () => {
                    speakerTag(false); document.body.classList.remove("boss"); Music.play("calm");
                    propEl.classList.add("runaway");
                    talk(c.reaction, line, "celebrate");
                  });
                }, calm() ? 0 : 900);
              });
            }, calm() ? 0 : 900);
          }
        } else if (s.id === "frog_bug") {
          // Freddie delivers the bug report the way the hero chose, then Ponder reacts.
          showReport(c.value);
          if (FROG_SAYS[c.value]) {
            speakerTag("Freddie");
            talk(FROG_SAYS[c.value], line, "talk", { speaker: "freddie", char: frogChar }, () => { speakerTag(false); talk(c.reaction, line, "celebrate"); });
          } else talk(c.reaction, line, "celebrate");
        } else talk(c.reaction, line, "celebrate");
        next.disabled = (puzzle || riddle) ? !solved : false;
      });
      return b;
    });
    function sync() { buttons.forEach(b => b.setAttribute("aria-pressed", String(multi ? picked.includes(b.dataset.value) : picked === b.dataset.value))); }
    sync();
    const skip = el("button", { class: "btn secondary", text: "Skip", onclick: () => { Sfx.play("next"); answers[s.field] = multi ? [] : null; advance(); } });
    show(
      el("h2", { class: "scene-title", id: "sceneTitle", text: s.title }),
      line,
      multi > 1 ? el("p", { class: "muted", text: `Pick up to ${multi}.` }) : null,
      el("div", { class: "choices", role: "group", "aria-label": s.title }, buttons),
      puzzle, riddle,
      el("div", { class: "actions" }, el("div", {}, skip), next));
    buttons[0].focus();
    function advance() { i + 1 < QUEST.scenes.length ? scene(i + 1) : mirror(); }
  }

  function summary() {
    return QUEST.scenes.flatMap(s => {
      const v = answers[s.field];
      const picked = Array.isArray(v) ? v : v ? [v] : [];
      const labels = picked.map(p => s.choices.find(c => c.value === p)).filter(Boolean).map(c => c.label);
      return labels.length ? [{ field: s.field, title: s.title, text: labels.join(" + ") }] : [];
    });
  }

  function mirror() {
    const keepFrog = POND && frogChar;
    document.body.classList.remove("storm"); Music.storm(false); actorEl.classList.remove("spot");
    document.body.classList.remove("boss"); speakerTag(false); clearVis();
    Music.play("calm");
    step = QUEST.scenes.length; renderProgress();
    if (!keepFrog) { propEl.className = ""; propEl.replaceChildren(); }
    const lines = summary();
    const line = say(lines.length ? "Here's how you do your best work. Does this sound like you?" : "You skipped everything, and that's totally okay!", "idle");
    const saved = PROGRESS.visibility || {};
    const list = el("ul", { class: "mirror-list" }, lines.map(l => {
      const sel = el("select", { "aria-label": `Who can see: ${l.title}`, "data-field": l.field },
        el("option", { value: "public", text: "Everyone" }),
        el("option", { value: "after_match", text: "After we match" }),
        el("option", { value: "private", text: "Only me" }));
      sel.value = saved[l.field] || DATA.defaultVisibility[l.field] || "public";
      return el("li", {}, el("span", {}, el("strong", { text: `${l.title.replace(/[!?.]$/, "")}: ` }), l.text), sel);
    }));
    const error = el("p", { class: "error", role: "alert" });
    const yes = el("button", { class: "btn", text: "Yes, that's me!" });
    yes.addEventListener("click", async () => {
      yes.disabled = true; error.textContent = "";
      const visibility = {};
      list.querySelectorAll("select").forEach(s => { visibility[s.dataset.field] = s.value; });
      try {
        const res = await fetch(`/quest/${QUEST.id}/finish`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers, visibility }) });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "Couldn't save your quest. Try again?");
        Sfx.play("success");
        finale(body.progress);
      } catch (e) { error.textContent = e.message; yes.disabled = false; }
    });
    show(el("h2", { class: "scene-title", id: "sceneTitle", text: "The Mirror" }), line, list,
      el("p", { class: "muted", text: "Choose who can see each answer. \"After we match\" answers help matching but stay hidden until your group forms. \"Only me\" answers are never used or shown." }),
      error,
      el("div", { class: "actions" }, el("button", { class: "btn secondary", text: "Not quite, let me change it", onclick: () => scene(0) }), yes));
    yes.focus();
  }

  function rocket() {
    // A pixel rocket for SwampBook's launch.
    const layers = [[3,0,2,1,"#e2474b"],[2,1,4,2,"#e2474b"],[2,3,4,6,"#f4f1ea"],[5,3,1,6,"#cfcabd"],[3,4,2,2,"#3f7fd1"],[3,4,1,1,"#9fd0ff"],[0,7,2,3,"#e2474b"],[6,7,2,3,"#e2474b"],[2,9,4,1,"#9aa3ad"],[3,10,2,2,"#f6a23a"],[3,12,2,1,"#f6d44a"]];
    return Pixel.svgFor({ width: 8, height: 13, label: "", layers }, 90, "");
  }

  function finale(progress) {
    Music.play("victory");
    step = QUEST.scenes.length + 1; renderProgress();
    const line = say(QUEST.finale, "celebrate");
    if (!(POND && frogChar)) { propEl.className = ""; propEl.replaceChildren(); }
    if (POND && frogChar) frogChar.setMood("celebrate");
    if (!POND) { showLaunch(); setTimeout(() => Sfx.play("rocket"), 900); }
    else { showFairSuccess(); setTimeout(() => Sfx.play("fanfare"), 600); }
    document.querySelectorAll("#floaters .float").forEach(f => f.classList.add("sunk"));
    setTimeout(() => Sfx.play("badge"), POND ? 1600 : 2300);
    confetti();
    const nextId = DATA.order.find(q => !progress.completed.includes(q));
    const nextQuest = nextId && DATA.quests[nextId];
    const go = nextQuest
      ? el("a", { class: "btn big", href: `/quest/${nextId}`, text: `Start ${nextQuest.name.split(":")[0]}` })
      : el("a", { class: "btn big", href: "/tavern", text: "Enter the Tavern" });
    show(el("h2", { class: "scene-title", id: "sceneTitle", text: "Quest complete!" }), line,
      el("p", {}, el("span", { class: "badge" }, `${QUEST.badge} badge earned`)),
      nextQuest ? el("p", { text: `Unlocked: ${nextQuest.name}. ${nextQuest.card}` })
        : el("p", { text: "Both quests done! The Tavern now knows how you work best, so your matches will be great." }),
      el("div", { class: "actions" }, el("a", { class: "btn secondary", href: "/home", text: "Back home" }), go));
    go.focus();
  }

  // Quick version: every question on one page, same answers saved.
  function quickMode() {
    Music.play("calm");
    step = -1; renderProgress();
    actorEl.className = ""; actor.setMood("idle");
    const form = el("form", {});
    QUEST.scenes.forEach(s => {
      const multi = s.multi || 0;
      const type = multi <= 1 ? "radio" : "checkbox";
      const current = answers[s.field];
      form.append(el("fieldset", {}, el("legend", { text: `${s.title}${multi > 1 ? ` (up to ${multi})` : ""}` }),
        s.choices.map(c => {
          const input = el("input", { type, name: s.field, value: c.value });
          input.checked = Array.isArray(current) ? current.includes(c.value) : current === c.value;
          return el("label", { style: "display:flex;gap:8px;align-items:center;min-height:40px" }, input, c.label);
        })));
    });
    form.append(el("div", { class: "actions" }, el("button", { class: "btn secondary", type: "button", text: "Back to the story", onclick: titleCard }), el("button", { class: "btn", type: "submit", text: "See my mirror" })));
    form.addEventListener("submit", e => {
      e.preventDefault();
      QUEST.scenes.forEach(s => {
        const vals = [...form.querySelectorAll(`input[name="${s.field}"]:checked`)].map(i => i.value);
        answers[s.field] = s.multi ? vals.slice(0, s.multi) : (vals[0] ?? null);
      });
      mirror();
    });
    show(el("h2", { class: "scene-title", id: "sceneTitle", text: "Quick version" }), form);
  }

  function confetti() {
    if (calm()) return;
    const box = document.getElementById("confetti");
    const colors = ["#ffd94a", "#6cc24a", "#ff8a3d", "#3ff0f0", "#c856d6", "#ff9ecf", "#7fd8ff"];
    box.replaceChildren(...Array.from({ length: 60 }, (_, i) => {
      const p = document.createElement("i");
      p.style.left = `${Math.random() * 100}%`; p.style.background = colors[i % colors.length]; p.style.animationDelay = `${Math.random() * 0.6}s`;
      return p;
    }));
    setTimeout(() => box.replaceChildren(), 3000);
  }

  calmToggle.addEventListener("change", () => {
    Sfx.play("toggle");
    store.set("wawm-calm", calmToggle.checked ? "1" : "0");
    document.body.classList.toggle("calm", calmToggle.checked);
    actor.setStill(calmToggle.checked);
    if (calmToggle.checked) actorEl.className = "";
  });
  voiceToggle.addEventListener("click", () => {
    voiceOn = !voiceOn; store.set("wawm-voice", voiceOn ? "1" : "0"); setVoiceButton();
    if (voiceOn) Sfx.play("toggle");
    if (!voiceOn) { try { voiceAudio.pause(); } catch {} if ("speechSynthesis" in window) speechSynthesis.cancel(); }  // lip-sync carries on at reading pace
  });

  drawWorld();
  titleCard();
</script>
</body>
</html>
