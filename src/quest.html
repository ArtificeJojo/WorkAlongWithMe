<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Work Along With Me: Quest</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">


<script src="/js/pixel.js"></script>
<script src="/js/sfx.js"></script>
<style>
  /* Same colours as the rest of the site; only the scenery behind is the quest's own */
  :root {
    --ink: #222; --panel: rgba(255, 255, 255, 0.92); --muted: #555; --button: rgb(107, 204, 236); --frame: rgb(35, 105, 246);
    --focus: #1f5fd6; --chip: #e6f6fc; --highlight: #ffe066; --tag: var(--frame); --sun-y: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); font-size: 18px; line-height: 1.45; background: #1f1a3d; }
  .screenframe { position: fixed; inset: 6px; z-index: 6; border: 4px solid var(--frame); border-radius: 16px; pointer-events: none; }
  body.pond { background: #7ec8f0; }

  /* ---------- the scenic world (decorative, behind everything) ---------- */
  #world { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  #world svg { width: 100%; height: 100%; display: block; }
  #sun { transform: translateY(var(--sun-y)); transition: transform 1.8s cubic-bezier(.45,0,.3,1); }
  .shimmer { animation: shimmer 2.4s ease-in-out infinite; }
  .shimmer.d2 { animation-delay: .6s; } .shimmer.d3 { animation-delay: 1.2s; }
  @keyframes shimmer { 0%,100% { opacity: .9 } 50% { opacity: .25 } }
  .firefly { animation: firefly 4s ease-in-out infinite; }
  @keyframes firefly { 0%,100% { transform: translate(0,0); opacity: .2 } 25% { opacity: 1 } 50% { transform: translate(6px,-5px); opacity: .5 } 75% { opacity: 1; transform: translate(-4px,-8px) } }
  .cloud { animation: drift 60s linear infinite; }
  .cloud.slow { animation-duration: 90s; }
  @keyframes drift { from { transform: translateX(-60px) } to { transform: translateX(380px) } }
  .fly { animation: flit 5s ease-in-out infinite; }
  /* Floating code blocks (swamp) and message bottles (pond): they sink away as the journey goes on */
  .float { animation: bob 2.4s ease-in-out infinite; transition: opacity 1.2s ease, transform 1.2s ease; }
  .float:nth-child(2n) { animation-duration: 3s; animation-delay: .4s; }
  .float:nth-child(3n) { animation-duration: 2.7s; animation-delay: .9s; }
  .float.sunk { opacity: 0; animation: none; transform: translateY(8px); }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0) } 30% { transform: translateY(1.4px) rotate(1.5deg) } 70% { transform: translateY(-.6px) rotate(-1.5deg) } }
  @keyframes flit { 0%,100% { transform: translate(0,0) } 30% { transform: translate(18px,-8px) } 60% { transform: translate(-10px,-14px) } }

  /* ---------- layout ---------- */
  #ui { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; max-width: 980px; margin: 0 auto; padding: 12px 16px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 1.4rem; color: white; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font: inherit; font-size: 1rem; background: var(--button); color: var(--ink); border: none; border-radius: 16px; padding: 6px 14px; display: inline-flex; gap: 6px; align-items: center; min-height: 40px; cursor: pointer; text-decoration: none; }
  .pill:hover { animation: shake 0.4s; }
  .pill input { width: 20px; height: 20px; }
  .pill[aria-pressed="false"] { opacity: .75; }

  /* journey map */
  .map { position: relative; margin: 14px 4px 0; height: 74px; }
  .map .trail { position: absolute; left: 22px; right: 22px; top: 50px; border-top: 5px dashed rgba(255,253,246,.85); }
  .map .stops { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: flex-end; }
  .map .stop { width: 44px; height: 44px; border-radius: 12px; background: var(--panel); display: grid; place-items: center; font-size: 1.3rem; }
  .map .stop:last-child { font-size: .85rem; }
  .map .stop.done { background: var(--highlight); }
  .map .stop.now { outline: 4px solid var(--frame); outline-offset: 2px; }
  .map .traveler { position: absolute; top: -4px; width: 44px; transform: translateX(-50%); transition: left 1s cubic-bezier(.4,1.4,.5,1); }

  /* stage: the character lives here, standing in the world */
  .stage { position: relative; flex: 1 1 auto; min-height: clamp(190px, 34vh, 340px); }
  #actor { position: absolute; left: 3%; bottom: -6px; transform-origin: 50% 100%; }
  #actor.submerged { transform: translateY(115%); }
  #actor.leap { animation: leap 1.2s cubic-bezier(.25,.7,.35,1) forwards; }
  /* squash and stretch: stretched tall on the way up, squashed flat on landing */
  @keyframes leap { 0% { transform: translateY(115%) scale(.85,1.2) } 38% { transform: translateY(-30%) scale(.9,1.14) rotate(-6deg) } 55% { transform: translateY(-36%) scale(1,1) rotate(2deg) } 76% { transform: translateY(0) scale(1.18,.82) rotate(0) } 88% { transform: translateY(-5%) scale(.95,1.06) } 100% { transform: translateY(0) scale(1,1) } }
  #actor.offstage { transform: translateX(160%); }
  #actor.swimin { animation: swimin 2.6s cubic-bezier(.3,.6,.4,1) forwards; }
  @keyframes swimin { 0% { transform: translateX(160%) translateY(0) rotate(0) } 20% { transform: translateX(118%) translateY(-4%) rotate(-3deg) } 40% { transform: translateX(76%) translateY(0) rotate(2deg) } 60% { transform: translateX(38%) translateY(-4%) rotate(-3deg) } 80% { transform: translateX(10%) translateY(0) rotate(1deg) } 92% { transform: translateX(-2%) scale(1.04,.96) } 100% { transform: translateX(0) translateY(0) scale(1,1) } }
  #prop { position: absolute; right: 5%; bottom: 0; display: flex; align-items: flex-end; }
  #prop.fly .px-char, #prop.liftoff > * { transform: translateY(-160%) scale(.4); opacity: 0; transition: transform 1s cubic-bezier(.5,-.4,.7,.6), opacity 1s ease-in; }
  .bubble-dot { position: absolute; width: 14px; height: 14px; border: 3px solid var(--ink); background: radial-gradient(circle at 35% 35%, #fff 0 25%, #bfefff 30%); border-radius: 50%; animation: rise 1.4s ease-out forwards; }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 1 } 50% { transform: translate(6px,-45px) scale(1) } 100% { transform: translate(-4px,-95px) scale(1.2); opacity: 0 } }
  .drop { position: absolute; width: 14px; height: 18px; background: #9fe2ff; border: 3px solid var(--ink); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation: splash .9s cubic-bezier(.2,.6,.5,1) forwards; }
  @keyframes splash { 0% { transform: translate(0,0) scale(.4) } 50% { transform: translate(calc(var(--dx) * .6), var(--dy)) scale(1) } 100% { transform: translate(var(--dx), 40px) scale(.6); opacity: 0 } }
  .ring { position: absolute; width: 60px; height: 16px; border: 4px solid #e8fbff; border-radius: 50%; transform: translateX(-50%) scale(.3); animation: ring 1s ease-out forwards; }
  @keyframes ring { to { transform: translateX(-50%) scale(4); opacity: 0 } }
  #prop .px-char { animation-name: px-pop, px-wobble; animation-duration: .6s, 1.1s; animation-iteration-count: 1, infinite; animation-delay: 0s, .6s; }

  /* dialogue box, like a story game */
  .dialog { position: relative; background: var(--panel); border: 4px solid var(--frame); border-radius: 16px; padding: 22px 18px 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); max-height: 62vh; overflow: auto; }
  .name-tag { position: absolute; z-index: 2; top: -16px; left: 18px; background: var(--tag); color: #fff; font-weight: bold; letter-spacing: .06em; text-transform: uppercase; padding: 4px 14px; border-radius: 16px; font-size: .95rem; }
  .dialog-wrap { position: relative; margin-top: 18px; }
  .scene-title { margin: 0 0 6px; font-size: 1.05rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .line { margin: 0; font-size: 1.3rem; font-weight: 500; min-height: 2.6em; }
  /* karaoke captions: words already said in full ink, the current word highlighted, the rest lighter */
  .line.karaoke .w { color: #8a8798; transition: color .15s; }
  .line.karaoke .w.said { color: var(--ink); }
  .line.karaoke .w.now { color: var(--ink); background: #fff1a8; border-radius: 6px; box-shadow: 0 0 0 3px #fff1a8; }
  .dialog.pop { animation: dpop .35s cubic-bezier(.3,.7,.4,1.4); }
  @keyframes dpop { 0% { transform: scale(.96) translateY(6px) } 100% { transform: none } }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
  .choice { font: inherit; text-align: left; display: flex; gap: 10px; align-items: center; min-height: 64px; padding: 10px 14px; border: 2px solid var(--button); border-radius: 12px; background: var(--chip); cursor: pointer; color: var(--ink); }
  .choice[aria-pressed="true"] { background: var(--highlight); border-color: #f5c400; }
  .choice:hover { transform: translateY(-2px); }
  .actions { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-top: 16px; }
  .btn { font: inherit; min-height: 44px; padding: 8px 18px; border-radius: 16px; border: none; background: var(--button); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .btn.secondary { background: #ddd; }
  .btn.big { font-size: 1.2rem; font-weight: bold; padding: 12px 26px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn:not(:disabled):hover { animation: shake 0.4s; }
  .choice { transition: transform .15s cubic-bezier(.3,.7,.4,1.6); }
  .choice:active { transform: translateY(2px) scale(.98); }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .title-card { text-align: center; }
  .title-card h2 { margin: 0 0 6px; font-size: 1.7rem; }
  .title-card p { margin: 0 0 14px; }
  .mirror-list { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 10px; }
  .mirror-list li { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--chip); border-radius: 12px; padding: 10px 14px; }
  .mirror-list select { font: inherit; min-height: 40px; border: 1px solid #999; border-radius: 4px; padding: 4px 8px; }
  .muted { color: var(--muted); font-size: .95rem; }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 1.3rem; font-weight: bold; background: var(--highlight); border-radius: 16px; padding: 8px 18px; }
  .error { color: #b00020; font-weight: bold; }
  fieldset { border: 2px solid var(--button); border-radius: 12px; margin: 0 0 12px; padding: 10px 14px; }
  @keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }
  legend { font-weight: bold; padding: 0 6px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti i { position: absolute; top: -12px; width: 10px; height: 10px; border: 2px solid var(--ink); border-radius: 3px; animation: fall 2s cubic-bezier(.3,.2,.6,1) forwards; }
  @keyframes fall { 0% { transform: translateY(0) rotate(0) } 50% { transform: translate(30px, 55vh) rotate(300deg) } 100% { transform: translate(-20px, 110vh) rotate(720deg) } }
  #prop.fly .px-char { animation: none; }
  .flame { transform-box: fill-box; transform-origin: 50% 0; animation: flick .12s ease-in-out infinite alternate; }
  @keyframes flick { from { transform: scaleY(.8) } to { transform: scaleY(1.15) } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* calm mode and reduced motion: everything holds still */
  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
  body.calm #actor { transform: none !important; }
  body.calm .confetti { display: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #actor { transform: none !important; }
    .confetti { display: none; }
  }
  @media (max-width: 560px) { .map .stop { width: 34px; height: 34px; font-size: 1rem; } .line { font-size: 1.1rem; } }
</style>
</head>
<body>
<div id="world" aria-hidden="true"></div>
<div id="ui">
  <header>
    <h1 id="questName">Quest</h1>
    <div class="toggles">
      <button class="pill" id="voiceToggle" aria-pressed="true">Sound on</button>
      <label class="pill"><input type="checkbox" id="calmToggle" /> Calm mode</label>
      <a class="pill" href="/home">Home</a>
    </div>
  </header>
  <nav class="map" id="map" aria-label="Quest journey"></nav>
  <p class="sr-only" id="progressText" aria-live="polite"></p>
  <div class="stage" id="stage" aria-hidden="true"><div id="actor"></div><div id="prop"></div></div>
  <div class="dialog-wrap">
    <div class="name-tag" id="nameTag"></div>
    <section class="dialog" id="dialog" aria-labelledby="questName"></section>
  </div>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="screenframe" aria-hidden="true"></div>

<script>
  const DATA = {{ quests_json|safe }};
  const PROGRESS = {{ progress_json|safe }};
  const QUEST = DATA.quests["{{ quest_id }}"];
  const POND = QUEST.id === "turtle";

  // The first words, before the quest's own intro line: the "who, me?" moment.
  const HELLO = POND
    ? { line: "Oh... hello there. Sorry, I'm a little slow. I was hoping someone kind would come by.", button: "Hi, Ponder!" }
    : { line: "WHOA, hey! You! Yeah, YOU! You're the hero everyone's been talking about, right?! I NEED your help!", button: "Who, me?" };

  // Sound effects: when a scene opens, and for each choice (scene id, or "scene:value" for a specific choice).
  const SCENE_SFX = { mega_bug: "splash", rainstorm: "thunder", message_flood: "clink", frog_bug: "ribbit" };
  const CHOICE_SFX = {
    powers: "sparkle", workbench: "clunk",
    "mega_bug:bite_sized": "pops", "mega_bug:large": "boom",
    "launch_bridge:checkins": "planks", "launch_bridge:single_deadline": "whoosh", "launch_bridge:flexible": "boing",
    locked_gate: "unlock",
    message_flood: "clink", "slow_riddle:take_time": "tick", "slow_riddle:instant": "whoosh",
    frog_bug: "ribbit", rainstorm: "calm", pond_fair: "fanfare",
  };

  // ------------------------------------------------------------- settings (kept per browser)
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const calmToggle = document.getElementById("calmToggle");
  const voiceToggle = document.getElementById("voiceToggle");
  calmToggle.checked = store.get("wawm-calm") === "1";
  let voiceOn = store.get("wawm-voice") !== "0";  // controls the voice AND the sound effects
  const setVoiceButton = () => {
    voiceToggle.setAttribute("aria-pressed", String(voiceOn));
    voiceToggle.textContent = voiceOn ? "Sound on" : "Sound off";
    Sfx.enabled = voiceOn;
  };
  setVoiceButton();

  document.body.classList.toggle("pond", POND);
  document.body.classList.toggle("calm", calmToggle.checked);
  document.getElementById("questName").textContent = QUEST.name;
  document.getElementById("nameTag").textContent = QUEST.guide;

  // ------------------------------------------------------------- voice
  // Picks a female English voice when the computer has one; Chomp is quick and bright, Ponder slow and calm.
  const FEMALE = /(aria|jenny|zira|samantha|ava|allison|susan|karen|moira|tessa|serena|michelle|emma|sonia|libby|google us english|google uk english female|female)/i;
  let chosenVoice = null;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    const voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    chosenVoice = voices.find(v => FEMALE.test(v.name) && /natural|online|neural/i.test(v.name))
      || voices.find(v => FEMALE.test(v.name)) || voices.find(v => /en-US/i.test(v.lang)) || voices[0] || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!voiceOn || !("speechSynthesis" in window)) return null;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (chosenVoice) u.voice = chosenVoice;
      u.rate = POND ? 0.86 : 1.12;
      u.pitch = POND ? 1.05 : 1.3;
      return u;  // the caller starts it, after hooking up lip-sync
    } catch { return null; }
  }

  // ------------------------------------------------------------- lip-sync
  // The mouth opens once per syllable of the word being said, and that word lights up (karaoke style).
  // It follows the voice's real word timing when the browser reports it, and otherwise an estimated pace,
  // so it also works with the sound off, for anyone reading instead of listening.
  const SYLLABLE_MS = POND ? 240 : 165;
  const syllables = w => Math.max(1, (w.toLowerCase().replace(/[^a-z]/g, "").replace(/e$/, "").match(/[aeiouy]+/g) || []).length);
  let talkToken = 0;
  function talk(text, lineEl, mood = "talk") {
    const token = ++talkToken;
    const live = () => token === talkToken;
    let mouthTimers = [], paceTimer = null, done = false;
    const clearMouth = () => { mouthTimers.forEach(clearTimeout); mouthTimers = []; };
    // Split into words (spaces kept), each in its own span.
    const parts = text.split(/(\s+)/);
    const words = [];
    let pos = 0;
    lineEl.replaceChildren(...parts.map(part => {
      const span = document.createElement("span");
      span.textContent = part;
      if (/\S/.test(part)) { span.className = "w"; words.push({ span, text: part, start: pos }); }
      pos += part.length;
      return span;
    }));
    lineEl.classList.remove("karaoke");
    actor.setMouth(null);
    actor.setMood(mood);
    const utter = speak(text);
    if (calm() || !words.length) {
      if (utter) speechSynthesis.speak(utter);
      if (mood === "talk") actor.setMood("idle");
      return;
    }
    lineEl.classList.add("karaoke");
    let current = -1;
    function sayWord(i, ms) {
      if (!live() || done || i <= current || i >= words.length) return;
      for (let k = Math.max(0, current); k < i; k++) words[k].span.className = "w said";
      current = i;
      words[i].span.className = "w now";
      clearMouth();
      const n = syllables(words[i].text), per = ms / n;
      for (let k = 0; k < n; k++) {
        mouthTimers.push(setTimeout(() => live() && actor.setMouth(true), k * per));
        mouthTimers.push(setTimeout(() => live() && actor.setMouth(false), k * per + per * 0.6));
      }
    }
    const wordMs = i => syllables(words[i].text) * SYLLABLE_MS;
    const pauseAfter = i => /[.!?…]$/.test(words[i].text) ? 320 : /[,;:]$/.test(words[i].text) ? 160 : 40;
    function finish() {
      if (!live() || done) return;
      done = true; clearMouth(); clearTimeout(paceTimer);
      words.forEach(w => { w.span.className = "w said"; });
      lineEl.classList.remove("karaoke");
      actor.setMouth(null);
      if (mood === "talk") actor.setMood("idle");
    }
    // Estimated pace, used with no voice, or if the voice gives no word timing.
    function pace(i) {
      if (!live() || done) return;
      if (i >= words.length) { paceTimer = setTimeout(finish, 150); return; }
      sayWord(i, wordMs(i));
      paceTimer = setTimeout(() => pace(i + 1), wordMs(i) + pauseAfter(i));
    }
    actor.setMouth(false);
    if (!utter) { pace(0); return; }
    let gotBoundary = false;
    utter.onboundary = e => {
      if (!live() || (e.name && e.name !== "word")) return;
      gotBoundary = true; clearTimeout(paceTimer);
      let i = 0;
      while (i + 1 < words.length && words[i + 1].start <= e.charIndex) i++;
      sayWord(i, wordMs(i) / (POND ? 0.86 : 1.12) * 0.9);
    };
    utter.onend = () => { if (live()) finish(); };
    utter.onerror = () => { if (live() && !gotBoundary) pace(Math.max(0, current + 1)); };
    utter.onstart = () => {
      // Some voices never report word timing: fall back to the estimated pace if none arrives quickly.
      paceTimer = setTimeout(() => { if (live() && !gotBoundary) pace(0); }, 450);
    };
    // If speech never starts (blocked or no voices installed), use the estimated pace.
    setTimeout(() => { if (live() && current < 0 && !gotBoundary && !done) pace(0); }, 1200);
    speechSynthesis.speak(utter);
  }

  // ------------------------------------------------------------- the world
  // Smooth cartoon scenery: thick ink outlines, round candy hills, flat bright colors.
  function drawWorld() {
    const INK = "#1b1b2f";
    const o = (w = 1.3) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
    // Overlapping circles melted into one outlined blob (clouds, tree tops, bushes).
    const blob = (circles, fill, w = 1.3, cls = "") =>
      `<g${cls ? ` class="${cls}"` : ""}>${circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + w}" fill="${INK}"/>`).join("")}` +
      `${circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join("")}</g>`;
    const wave = (y0, amp, step = 20) => { let d = `M-10 ${y0}`; for (let x = -10; x < 330; x += step) d += ` q${step / 4} ${-amp} ${step / 2} 0 t${step / 2} 0`; return d; };
    const lily = (x, y, s = 1, flower = true) =>
      `<path d="M${x} ${y} L${x + 9 * s} ${y - 1.74 * s} A${10 * s} ${4 * s} 0 1 0 ${x + 9 * s} ${y + 1.74 * s} Z" fill="#5cc46a" ${o(1)}/>` +
      `<path d="M${x - 6 * s} ${y - 1 * s} Q${x - 2 * s} ${y - 2.5 * s} ${x + 3 * s} ${y - 2 * s}" fill="none" stroke="#3d9a4c" stroke-width=".8" stroke-linecap="round"/>` +
      (flower ? `<circle cx="${x - 3 * s}" cy="${y - 3 * s}" r="${2 * s}" fill="#ff9ecf" ${o(.9)}/><circle cx="${x - 3 * s}" cy="${y - 3 * s}" r="${.8 * s}" fill="#fff6a8"/>` : "");
    const cattail = (x, base, h, lean = 0) =>
      `<path d="M${x} ${base} Q${x + lean / 2} ${base - h / 2} ${x + lean} ${base - h}" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>` +

    let defs = "";

    if (!POND) {
      // ---- Kanban Swamp at sunset
      defs = `<linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1f5c"/><stop offset=".38" stop-color="#7b3f8c"/><stop offset=".64" stop-color="#e2667a"/><stop offset=".84" stop-color="#ffa268"/><stop offset="1" stop-color="#ffd98a"/></linearGradient>` +

      svg += `<g class="cloud slow">${blob([[30, 40, 6], [38, 37, 8], [47, 40, 6]], "#f7a6b8", 1)}</g><g class="cloud">${blob([[150, 28, 5], [157, 25, 7], [165, 28, 5]], "#f9b9a8", 1)}</g>`;
      // far bumpy hills, then swamp trees with hanging moss
      svg += `<path d="M-10 110 Q14 88 40 102 Q66 82 96 100 Q128 78 160 98 Q190 84 216 102 Q246 86 272 100 Q298 88 330 102 L330 128 L-10 128Z" fill="#9b5592" ${o(1.1)}/>`;
      const tree = (x, base, h, r, c = "#4a2b63") =>

        blob([[x - r * .8, base - h, r * .75], [x, base - h - r * .45, r], [x + r * .85, base - h, r * .7]], c, 1.1) +
        [-.7, -.1, .6].map(k => `<path d="M${x + r * k} ${base - h + r * .4} q1 6 -1 ${9 + Math.abs(k) * 6}" fill="none" stroke="#7fa86a" stroke-width="1.2" stroke-linecap="round"/>`).join("");
      [[18, 118, 34, 11], [70, 118, 26, 9], [122, 118, 38, 12], [176, 118, 24, 8], [278, 118, 36, 12], [314, 118, 28, 10]].forEach(([x, b, h, r]) => { svg += tree(x, b, h, r); });
      svg += `<path d="M-10 118 Q60 112 140 117 Q220 121 330 115 L330 126 L-10 126Z" fill="#3b2450" ${o(1.1)}/>`;
      // the water
      svg += `<path d="${wave(122, 1.6)} L330 230 L-10 230Z" fill="url(#waterG)" ${o(1.3)}/>`;
      [[220, 130, 22], [226, 137, 14, "d2"], [218, 145, 26, "d3"], [228, 154, 12], [222, 163, 18, "d2"]].forEach(([x, y, w, d]) => {
        svg += `<path d="M${x} ${y} h${w}" stroke="#ffb27a" stroke-width="1.6" stroke-linecap="round" class="shimmer ${d || ""}"/>`;
      });
      [[30, 140], [70, 166], [262, 172], [150, 176]].forEach(([x, y]) => { svg += `<path d="M${x} ${y} q3 -2 6 0 t6 0" fill="none" stroke="#8fa3d6" stroke-width=".9" stroke-linecap="round"/>`; });
      [[52, 152, 1.1], [140, 166, 1], [196, 148, .9, false], [286, 160, 1.2]].forEach(([x, y, s, f]) => { svg += lily(x, y, s, f !== false); });
      // Tangled code blocks floating in the swamp (story: "the swamp is FLOODED with tangled code blocks")
      const blocks = [["#5c7cfa", "{ }"], ["#ff922b", "</>"], ["#f06595", "if"], ["#20c997", "fn()"], ["#fcc419", "[ ]"], ["#845ef7", "=>"], ["#4dabf7", "++"], ["#ff6b6b", "01"]];
      let floats = "";
      [[100, 126, -8], [152, 131, 6], [204, 125, -4], [126, 139, 10], [180, 142, -6], [240, 134, 5], [92, 150, 4], [214, 151, -10]].forEach(([x, y, rot], i) => {
        const [fill, txt] = blocks[i];
        floats += `<g class="float"><g transform="rotate(${rot} ${x + 10} ${y + 6})">` +
          `<rect x="${x}" y="${y}" width="20" height="12" rx="3" fill="${fill}" ${o(1.2)}/>` +
          `<rect x="${x + 2.5}" y="${y + 1.8}" width="10" height="1.6" rx=".8" fill="#ffffff" opacity=".45"/>` +
          `<text x="${x + 10}" y="${y + 9.2}" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="6.2" fill="#fff" stroke="${INK}" stroke-width=".5" paint-order="stroke">${txt.replace("<", "&lt;").replace(">", "&gt;")}</text></g>` +
          `<path d="M${x - 3} ${y + 12.5} q3 -1.6 6 0 t6 0 t6 0 t6 0" fill="none" stroke="#9fb4e8" stroke-width=".9" stroke-linecap="round"/></g>`;
      });
      svg += `<g id="floaters">${floats}</g>`;
      for (let i = 0; i < 12; i++) svg += `<g class="firefly" style="animation-delay:${(i % 6) * 0.6}s"><circle cx="${(i * 53 + 17) % 310}" cy="${84 + (i * 29) % 60}" r="2.6" fill="#fff6a0" opacity=".25"/><circle cx="${(i * 53 + 17) % 310}" cy="${84 + (i * 29) % 60}" r="1" fill="#fffbd0"/></g>`;
      // foreground banks and cattails
      svg += blob([[-6, 214, 30], [24, 220, 22]], "#2a1c3d", 1.4) + blob([[326, 212, 30], [296, 222, 20]], "#2a1c3d", 1.4);
      [[6, 196, 34, -3], [12, 198, 26, 2], [18, 200, 30, 4], [300, 198, 30, -4], [308, 196, 36, 2], [314, 200, 24, 5]].forEach(([x, b, h, l]) => { svg += cattail(x, b, h, l); });
    } else {
      // ---- Ping Pond on a bright day
      defs = `<linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ccfff"/><stop offset=".6" stop-color="#bfeeff"/><stop offset="1" stop-color="#fff6cf"/></linearGradient>` +
        `<linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd6d2"/><stop offset=".5" stop-color="#3fa9ad"/><stop offset="1" stop-color="#226f79"/></linearGradient>`;
      svg += `<rect x="-10" y="0" width="340" height="128" fill="url(#skyG)"/>`;
      svg += `<g id="sun"><circle cx="262" cy="34" r="22" fill="#fff3a6" opacity=".45"/><circle cx="262" cy="34" r="13" fill="#ffe66d" ${o(1.3)}/><circle cx="258" cy="30" r="3.5" fill="#fff9cf"/></g>`;
      const cloud = (x, y, s) => blob([[x, y, 6 * s], [x + 8 * s, y - 4 * s, 8 * s], [x + 17 * s, y - 1 * s, 7 * s], [x + 24 * s, y + 1 * s, 5 * s]], "#ffffff", 1.2);
      svg += `<g class="cloud">${cloud(20, 30, 1)}</g><g class="cloud slow">${cloud(140, 20, 1.2)}</g><g class="cloud">${cloud(222, 48, .8)}</g>`;
      // big round candy hills with lollipop trees
      svg += blob([[30, 128, 34], [100, 134, 40], [190, 132, 38], [270, 126, 40], [330, 132, 30]], "#a6e89a", 1.3);
      const lolly = (x, y, h, c) => `<path d="M${x} ${y} v${-h}" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/><path d="M${x} ${y} v${-h}" stroke="#a0714a" stroke-width="1" stroke-linecap="round"/><circle cx="${x}" cy="${y - h - 4}" r="5" fill="${c}" ${o(1.1)}/><path d="M${x - 2.5} ${y - h - 6} q2 -2 4 0" fill="none" stroke="#fff" stroke-width=".9" stroke-linecap="round" opacity=".7"/>`;
      svg += lolly(150, 100, 8, "#ff9ecf") + lolly(166, 102, 6, "#ffd94a") + lolly(236, 92, 9, "#7fd8ff") + lolly(290, 92, 7, "#ff9ecf");
      svg += blob([[60, 140, 30], [150, 146, 34], [240, 142, 32], [320, 146, 26]], "#79cf86", 1.3);
      // willow tree (kept inside the area every screen shape shows)
      svg += `<path d="M66 122 Q70 96 66 72 L76 72 Q74 98 82 122 Z" fill="#8a5a3a" ${o(1.3)}/>`;
      svg += blob([[56, 62, 14], [72, 54, 17], [90, 62, 13], [64, 70, 12], [84, 72, 11]], "#5fbf6e", 1.3);
      for (let i = 0; i < 9; i++) {
        const x = 50 + i * 5.2, len = 20 + (i % 3) * 9;
        svg += `<path d="M${x} 70 q${i % 2 ? 2 : -2} ${len / 2} 0 ${len}" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/><path d="M${x} 70 q${i % 2 ? 2 : -2} ${len / 2} 0 ${len}" fill="none" stroke="#4fae5c" stroke-width="1.6" stroke-linecap="round"/>`;
      }
      // the water
      svg += `<path d="${wave(122, 1.6)} L330 230 L-10 230Z" fill="url(#waterG)" ${o(1.3)}/>`;
      [[40, 130, 24], [120, 142, 16, "d2"], [210, 134, 28, "d3"], [270, 152, 18], [80, 164, 22, "d2"]].forEach(([x, y, w, d]) => {
        svg += `<path d="M${x} ${y} h${w}" stroke="#effdff" stroke-width="1.5" stroke-linecap="round" class="shimmer ${d || ""}"/>`;
      });
      [[60, 154, 1.1], [150, 168, 1], [238, 148, .9, false], [300, 166, 1.2]].forEach(([x, y, s, f]) => { svg += lily(x, y, s, f !== false); });
      for (let i = 0; i < 4; i++) {
        const x = 70 + i * 60, y = 100 + (i % 2) * 14;
        svg += `<g class="fly" style="animation-delay:${i}s"><ellipse cx="${x - 1}" cy="${y - 2.4}" rx="3.2" ry="1.6" fill="#e8fbff" ${o(.7)}/><ellipse cx="${x + 2}" cy="${y - 2.4}" rx="3.2" ry="1.6" fill="#e8fbff" ${o(.7)}/>` +
          `<path d="M${x - 4} ${y} h9" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/><path d="M${x - 4} ${y} h9" stroke="#2c9bc8" stroke-width="1.2" stroke-linecap="round"/></g>`;
      }
      // Message bottles crowding the pond (story: "the pond is flooded with bottles, croaks and splashes")
      let bottles = "";
      [[108, 126, -12], [148, 133, 14], [196, 124, -6], [232, 137, 10], [128, 145, -16], [178, 147, 8], [254, 129, -10]].forEach(([x, y, rot]) => {
        bottles += `<g class="float"><g transform="rotate(${rot} ${x + 4} ${y + 6})">` +
          `<rect x="${x + 2.2}" y="${y - 4}" width="3.6" height="5" rx="1" fill="#c8f3ea" ${o(1)}/>` +
          `<rect x="${x + 1.8}" y="${y - 6}" width="4.4" height="2.4" rx="1" fill="#b07a4a" ${o(.9)}/>` +
          `<rect x="${x}" y="${y}" width="8" height="12" rx="3" fill="#c8f3ea" ${o(1.1)}/>` +
          `<rect x="${x + 2}" y="${y + 2.5}" width="4" height="6" rx=".8" fill="#fffbea" stroke="#d29a44" stroke-width=".5"/>` +
          `<path d="M${x + 1.4} ${y + 2} v6" stroke="#fff" stroke-width=".9" stroke-linecap="round" opacity=".8"/></g>` +
          `<path d="M${x - 3} ${y + 12.5} q2.5 -1.4 5 0 t5 0 t5 0" fill="none" stroke="#e8fbff" stroke-width=".9" stroke-linecap="round"/></g>`;
      });
      svg += `<g id="floaters">${bottles}</g>`;
      svg += blob([[-6, 214, 28], [22, 222, 20]], "#3f9a52", 1.4) + blob([[326, 212, 28], [298, 222, 18]], "#3f9a52", 1.4);
      [[6, 196, 32, -3], [13, 198, 24, 2], [304, 198, 30, -4], [312, 196, 34, 3]].forEach(([x, b, h, l]) => { svg += cattail(x, b, h, l); });
    }
    // Raised by 30 so the water, the floating blocks and the characters sit above the dialogue box.
    document.getElementById("world").innerHTML =
      `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs><g transform="translate(0,-30)">${svg}</g></svg>`;
  }

  // ------------------------------------------------------------- journey map
  const map = document.getElementById("map");
  const stopsCount = QUEST.scenes.length + 1;
  map.innerHTML = `<div class="trail"></div><div class="stops"></div><div class="traveler"></div>`;
  map.querySelector(".stops").append(...[...QUEST.scenes.map((s, i) => String(i + 1)), "End"].map(label => {
    const d = document.createElement("div"); d.className = "stop"; d.textContent = label; return d;
  }));
  map.querySelector(".traveler").append(Pixel.svgFor(Pixel.sprites[QUEST.character]({}), 44, ""));

  function renderProgress() {
    const stops = [...map.querySelectorAll(".stop")];
    const at = Math.max(0, Math.min(step, stopsCount - 1));
    stops.forEach((s, i) => { s.className = "stop" + (i < at || (step > QUEST.scenes.length) ? " done" : "") + (i === at && step >= 0 ? " now" : ""); });
    const pct = stopsCount > 1 ? at / (stopsCount - 1) : 0;
    map.querySelector(".traveler").style.left = `calc(22px + (100% - 44px) * ${pct})`;
    // The swamp/pond clears as the journey goes on: floaters sink away one by one.
    const floaters = [...document.querySelectorAll("#floaters .float")];
    const keep = Math.round(floaters.length * (1 - pct));
    floaters.forEach((f, i) => f.classList.toggle("sunk", i < floaters.length - keep));
    // The sun sets as the journey goes on.
    document.documentElement.style.setProperty("--sun-y", `${Math.round(pct * (POND ? 30 : 52))}px`);
    document.getElementById("progressText").textContent =
      step >= 0 && step < QUEST.scenes.length ? `Scene ${step + 1} of ${QUEST.scenes.length}: ${QUEST.scenes[step].title}` : "";
  }

  // ------------------------------------------------------------- the character in the world
  const actorEl = document.getElementById("actor");
  const propEl = document.getElementById("prop");
  const actorSize = () => Math.round(Math.min(window.innerWidth * 0.32, POND ? 280 : 250));
  const actor = Pixel.mount(actorEl, QUEST.character, { size: actorSize(), mood: "idle", still: calmToggle.checked, label: "" });
  const calm = () => calmToggle.checked || matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ------------------------------------------------------------- dialogue box
  const dialog = document.getElementById("dialog");
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    kids.flat().forEach(c => c != null && n.append(c));
    return n;
  };
  const show = (...nodes) => {
    dialog.replaceChildren(...nodes.flat().filter(n => n != null));
    dialog.classList.remove("pop"); void dialog.offsetWidth; dialog.classList.add("pop");
  };
  function say(text, mood = "talk") {
    const p = el("p", { class: "line", "aria-live": "polite" });
    talk(text, p, mood);
    return p;
  }

  // ------------------------------------------------------------- state
  const answers = {};
  QUEST.scenes.forEach(s => { if (PROGRESS.answers && PROGRESS.answers[s.field] != null) answers[s.field] = PROGRESS.answers[s.field]; });
  let step = -1; // -1 intro, 0..n-1 scenes, n mirror, n+1 finale

  // ------------------------------------------------------------- screens
  function titleCard() {
    step = -1; renderProgress();
    propEl.replaceChildren();
    actorEl.className = calm() ? "" : (POND ? "offstage" : "submerged");
    actor.setMood("idle");
    const start = el("button", { class: "btn big", text: "Start the adventure", onclick: entrance });
    // (sounds can only start after this first click, so the title card itself is silent)
    show(el("div", { class: "title-card" },
      el("h2", { text: QUEST.name }),
      el("p", { text: QUEST.card }),
      el("p", { class: "muted", text: "No timers, no wrong answers. Every choice is a win, and you can skip anything." }),
      el("div", { class: "actions", style: "justify-content:center" },
        start, el("button", { class: "btn secondary", text: "Quick version (one page)", onclick: quickMode }))));
    start.focus();
  }

  // The big entrance: Chomp leaps out of the swamp; Ponder paddles in from the right.
  function entrance() {
    Sfx.play("start");
    if (calm()) { actorEl.className = ""; return hello(); }
    show(say(POND ? "..." : "*blub... blub...*", "idle"));
    if (POND) {
      actorEl.className = "swimin";
      Sfx.play("swim");
      setTimeout(hello, 2600);
    } else {
      bubbles();
      setTimeout(() => Sfx.play("bubbles"), 200);
      setTimeout(() => { actorEl.className = "leap"; Sfx.play("splash"); setTimeout(splash, 450); }, 1300);
      setTimeout(hello, 2500);
    }
  }
  function bubbles() {
    const stage = document.getElementById("stage");
    for (let i = 0; i < 6; i++) {
      const b = el("span", { class: "bubble-dot" });
      b.style.left = `calc(3% + ${40 + Math.random() * 120}px)`; b.style.bottom = "10px"; b.style.animationDelay = `${i * 0.18}s`;
      stage.append(b); setTimeout(() => b.remove(), 2400);
    }
  }
  function splash() {
    const stage = document.getElementById("stage");
    for (let i = 0; i < 14; i++) {
      const d = el("span", { class: "drop" });
      d.style.left = `calc(3% + ${actorSize() / 2}px)`; d.style.bottom = "8px";
      d.style.setProperty("--dx", `${(Math.random() - 0.5) * 260}px`);
      d.style.setProperty("--dy", `${-60 - Math.random() * 120}px`);
      stage.append(d); setTimeout(() => d.remove(), 1000);
    }
    const ring = el("span", { class: "ring" });
    ring.style.left = `calc(3% + ${actorSize() / 2}px)`; ring.style.bottom = "4px";
    stage.append(ring); setTimeout(() => ring.remove(), 1100);
  }
  function hello() {
    actorEl.className = "";
    const next = el("button", { class: "btn", text: HELLO.button, onclick: () => { Sfx.play("select"); intro(); } });
    show(say(HELLO.line), el("div", { class: "actions", style: "justify-content:flex-end" }, next));
    next.focus();
  }
  function intro() {
    const go = el("button", { class: "btn", text: QUEST.intro.button, onclick: () => { Sfx.play(POND ? "ripple" : "splash"); scene(0); } });
    show(say(QUEST.intro.line), el("div", { class: "actions", style: "justify-content:flex-end" }, go));
    go.focus();
  }

  function scene(i) {
    step = i; renderProgress();
    const s = QUEST.scenes[i];
    propEl.className = ""; propEl.replaceChildren();
    if (s.id === "mega_bug") Pixel.mount(propEl, "megabug", { size: Math.min(window.innerWidth * 0.28, 210), still: calm(), label: "" });
    if (SCENE_SFX[s.id]) setTimeout(() => Sfx.play(SCENE_SFX[s.id]), 250);
    const line = say(s.line);
    const multi = s.multi || 0;
    let picked = multi ? [...(answers[s.field] || [])] : answers[s.field] ?? null;
    const next = el("button", { class: "btn", text: i + 1 < QUEST.scenes.length ? "Next" : "See what I learned", onclick: () => { Sfx.play("next"); advance(); } });
    next.disabled = multi ? false : picked == null;

    const buttons = s.choices.map(c => {
      const b = el("button", { class: "choice", "aria-pressed": "false" },
        el("span", { text: c.label }));
      b.dataset.value = c.value;
      b.addEventListener("click", () => {
        if (multi) picked = picked.includes(c.value) ? picked.filter(v => v !== c.value) : (multi === 1 ? [c.value] : [...picked, c.value].slice(-multi));
        else picked = c.value;
        answers[s.field] = picked;
        sync();
        Sfx.play("select");
        setTimeout(() => Sfx.play(CHOICE_SFX[`${s.id}:${c.value}`] || CHOICE_SFX[s.id] || "select"), 120);
        talk(c.reaction, line, "celebrate");
        if (s.id === "mega_bug") {
          if (c.value === "bite_sized") { propEl.className = ""; Pixel.squad(propEl, { still: calm(), size: 54 }); }
          else propEl.className = "fly";
        }
        next.disabled = false;
      });
      return b;
    });
    function sync() { buttons.forEach(b => b.setAttribute("aria-pressed", String(multi ? picked.includes(b.dataset.value) : picked === b.dataset.value))); }
    sync();
    const skip = el("button", { class: "btn secondary", text: "Skip", onclick: () => { Sfx.play("next"); answers[s.field] = multi ? [] : null; advance(); } });
    const back = el("button", { class: "btn secondary", text: "Back", onclick: () => { Sfx.play("back"); i === 0 ? intro() : scene(i - 1); } });
    show(
      el("h2", { class: "scene-title", id: "sceneTitle", text: s.title }),
      line,
      multi > 1 ? el("p", { class: "muted", text: `Pick up to ${multi}.` }) : null,
      el("div", { class: "choices", role: "group", "aria-label": s.title }, buttons),
      el("div", { class: "actions" }, el("div", {}, back, " ", skip), next));
    buttons[0].focus();
    function advance() { i + 1 < QUEST.scenes.length ? scene(i + 1) : mirror(); }
  }

  function summary() {
    return QUEST.scenes.flatMap(s => {
      const v = answers[s.field];
      const picked = Array.isArray(v) ? v : v ? [v] : [];
      const labels = picked.map(p => s.choices.find(c => c.value === p)).filter(Boolean).map(c => c.label);
      return labels.length ? [{ field: s.field, title: s.title, text: labels.join(" + ") }] : [];
    });
  }

  function mirror() {
    step = QUEST.scenes.length; renderProgress();
    propEl.className = ""; propEl.replaceChildren();
    const lines = summary();
    const line = say(lines.length ? "Here's how you do your best work. Does this sound like you?" : "You skipped everything, and that's totally okay!", "idle");
    const saved = PROGRESS.visibility || {};
    const list = el("ul", { class: "mirror-list" }, lines.map(l => {
      const sel = el("select", { "aria-label": `Who can see: ${l.title}`, "data-field": l.field },
        el("option", { value: "public", text: "Everyone" }),
        el("option", { value: "after_match", text: "After we match" }),
        el("option", { value: "private", text: "Only me" }));
      sel.value = saved[l.field] || DATA.defaultVisibility[l.field] || "public";
      return el("li", {}, el("span", {}, el("strong", { text: `${l.title.replace(/[!?.]$/, "")}: ` }), l.text), sel);
    }));
    const error = el("p", { class: "error", role: "alert" });
    const yes = el("button", { class: "btn", text: "Yes, that's me!" });
    yes.addEventListener("click", async () => {
      yes.disabled = true; error.textContent = "";
      const visibility = {};
      list.querySelectorAll("select").forEach(s => { visibility[s.dataset.field] = s.value; });
      try {
        const res = await fetch(`/quest/${QUEST.id}/finish`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers, visibility }) });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "Couldn't save your quest. Try again?");
        Sfx.play("success");
        finale(body.progress);
      } catch (e) { error.textContent = e.message; yes.disabled = false; }
    });
    show(el("h2", { class: "scene-title", id: "sceneTitle", text: "The Mirror" }), line, list,
      el("p", { class: "muted", text: "Choose who can see each answer. \"After we match\" answers help matching but stay hidden until your group forms. \"Only me\" answers are never used or shown." }),
      error,
      el("div", { class: "actions" }, el("button", { class: "btn secondary", text: "Not quite, let me change it", onclick: () => scene(0) }), yes));
    yes.focus();
  }

  function rocket() {
    // A chunky cartoon rocket for SwampBook's launch.
    const I = 'stroke="#1b1b2f" stroke-width="4" stroke-linejoin="round"';
    return Pixel.svgFor({ width: 70, height: 120, label: "", svg:
      `<path d="M22 84 L8 104 L26 98 Z" fill="#ff5d6c" ${I}/><path d="M48 84 L62 104 L44 98 Z" fill="#ff5d6c" ${I}/>` +
      `<path class="flame" d="M26 98 Q35 128 44 98 Z" fill="#ffb03a" ${I}/>` +
      `<path d="M35 4 C56 22 54 66 48 98 L22 98 C16 66 14 22 35 4 Z" fill="#f7f4ec" ${I}/>` +
      `<path d="M35 4 C44 12 48 22 49 30 L21 30 C22 22 26 12 35 4 Z" fill="#ff5d6c" ${I}/>` +
      `<circle cx="35" cy="54" r="10" fill="#7fd8ff" ${I}/><circle cx="32" cy="51" r="3" fill="#fff"/>` +
      `<path d="M28 98 v-8 M42 98 v-8" stroke="#1b1b2f" stroke-width="3" stroke-linecap="round"/>` }, 90, "");
  }

  function finale(progress) {
    step = QUEST.scenes.length + 1; renderProgress();
    const line = say(QUEST.finale, "celebrate");
    propEl.className = ""; propEl.replaceChildren();
    if (!POND) { propEl.append(el("div", {}, rocket())); setTimeout(() => Sfx.play("rocket"), 700); if (!calm()) setTimeout(() => { propEl.className = "liftoff"; }, 900); }
    else setTimeout(() => Sfx.play("fanfare"), 600);
    setTimeout(() => Sfx.play("badge"), POND ? 1600 : 2300);
    confetti();
    const nextId = DATA.order.find(q => !progress.completed.includes(q));
    const nextQuest = nextId && DATA.quests[nextId];
    const go = nextQuest
      ? el("a", { class: "btn big", href: `/quest/${nextId}`, text: `Start ${nextQuest.name.split(":")[0]}` })
      : el("a", { class: "btn big", href: "/tavern", text: "Enter the Tavern" });
    show(el("h2", { class: "scene-title", id: "sceneTitle", text: "Quest complete!" }), line,
      el("p", {}, el("span", { class: "badge" }, `${QUEST.badge} badge earned`)),
      nextQuest ? el("p", { text: `Unlocked: ${nextQuest.name}. ${nextQuest.card}` })
        : el("p", { text: "Both quests done! The Tavern now knows how you work best, so your matches will be great." }),
      el("div", { class: "actions" }, el("a", { class: "btn secondary", href: "/home", text: "Back home" }), go));
    go.focus();
  }

  // Quick version: every question on one page, same answers saved.
  function quickMode() {
    step = -1; renderProgress();
    actorEl.className = ""; actor.setMood("idle");
    const form = el("form", {});
    QUEST.scenes.forEach(s => {
      const multi = s.multi || 0;
      const type = multi <= 1 ? "radio" : "checkbox";
      const current = answers[s.field];
      form.append(el("fieldset", {}, el("legend", { text: `${s.title}${multi > 1 ? ` (up to ${multi})` : ""}` }),
        s.choices.map(c => {
          const input = el("input", { type, name: s.field, value: c.value });
          input.checked = Array.isArray(current) ? current.includes(c.value) : current === c.value;
          return el("label", { style: "display:flex;gap:8px;align-items:center;min-height:40px" }, input, c.label);
        })));
    });
    form.append(el("div", { class: "actions" }, el("button", { class: "btn secondary", type: "button", text: "Back to the story", onclick: titleCard }), el("button", { class: "btn", type: "submit", text: "See my mirror" })));
    form.addEventListener("submit", e => {
      e.preventDefault();
      QUEST.scenes.forEach(s => {
        const vals = [...form.querySelectorAll(`input[name="${s.field}"]:checked`)].map(i => i.value);
        answers[s.field] = s.multi ? vals.slice(0, s.multi) : (vals[0] ?? null);
      });
      mirror();
    });
    show(el("h2", { class: "scene-title", id: "sceneTitle", text: "Quick version" }), form);
  }

  function confetti() {
    if (calm()) return;
    const box = document.getElementById("confetti");
    const colors = ["#ffd94a", "#6cc24a", "#ff8a3d", "#3ff0f0", "#c856d6", "#ff9ecf", "#7fd8ff"];
    box.replaceChildren(...Array.from({ length: 60 }, (_, i) => {
      const p = document.createElement("i");
      p.style.left = `${Math.random() * 100}%`; p.style.background = colors[i % colors.length]; p.style.animationDelay = `${Math.random() * 0.6}s`;
      return p;
    }));
    setTimeout(() => box.replaceChildren(), 3000);
  }

  calmToggle.addEventListener("change", () => {
    Sfx.play("toggle");
    store.set("wawm-calm", calmToggle.checked ? "1" : "0");
    document.body.classList.toggle("calm", calmToggle.checked);
    actor.setStill(calmToggle.checked);
    if (calmToggle.checked) actorEl.className = "";
  });
  voiceToggle.addEventListener("click", () => {
    voiceOn = !voiceOn; store.set("wawm-voice", voiceOn ? "1" : "0"); setVoiceButton();
    if (voiceOn) Sfx.play("toggle");
    if (!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();  // lip-sync carries on at reading pace
  });

  drawWorld();
  titleCard();
</script>
</body>
</html>
