<!doctype html>
<meta charset="UTF-8" />
<title>Work Along With Me</title>

<div id="profileButtons">
  <button onclick="location.href = '/home'">Home</button>
  <button onclick="location.href = '/connections'">Connections</button>
  <button id="invitesButton" {% if has_invites %}class="highlight"{% endif %} onclick="location.href = '/invites'">Invites</button>
  <button onclick="location.href = '/logout'">Logout</button>
</div>

<div id="profileBar">
  <img id="profilePicture" src="/profile-picture" alt="Profile picture" title="Click to change" />
  <button id="resetPicture" {% if not has_custom_picture %}hidden{% endif %}>Reset to default</button>
  <h1>{{ username }}</h1>
</div>
<input id="pictureInput" type="file" accept=".jpg,.jpeg,.png,.gif,.webp" hidden />

<div class="screen-frame"></div>

<section id="projects">
  <h2>Projects</h2>
  <div id="line"></div>
  <div id="projectGrid"></div>
  <p id="noProjects" class="empty" hidden>No projects yet.</p>
  <div id="pager" hidden>
    <button id="prevPage">Previous</button>
    <span id="pageLabel"></span>
    <button id="nextPage">Next</button>
  </div>
</section>

<script>
  // Projects this person created or joined, 6 per page, newest first
  (() => {
    const userId = {{ user_id|tojson }};
    const grid = document.getElementById("projectGrid");
    const pager = document.getElementById("pager");
    const prevPage = document.getElementById("prevPage");
    const nextPage = document.getElementById("nextPage");
    let page = 1;

    const projectCard = project => {
      const card = document.createElement("a");
      card.className = "project-card";
      card.href = `/project/${project.id}`;

      if (project.thumbnail) {
        const thumbnail = document.createElement("img");
        thumbnail.src = project.thumbnail;
        thumbnail.alt = "";
        card.append(thumbnail);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "no-thumbnail";
        card.append(placeholder);
      }

      const title = document.createElement("span");
      title.className = "title";
      title.textContent = project.title;

      const role = document.createElement("span");
      role.className = "role";
      role.textContent = project.role === "creator" ? "Creator" : "Contributor";

      // Creator + up to 3 members, with "+N" after the last picture for anyone not shown
      const people = document.createElement("div");
      people.className = "people";
      project.people.forEach(person => {
        const picture = document.createElement("img");
        picture.src = person.picture;
        picture.alt = person.username;
        picture.title = person.username;
        people.append(picture);
      });
      if (project.extra > 0) {
        const extra = document.createElement("span");
        extra.className = "extra";
        extra.textContent = `+${project.extra}`;
        people.append(extra);
      }

      card.append(title, role, people);
      return card;
    };

    const loadProjects = async () => {
      const response = await fetch(`/users/${userId}/projects?page=${page}`);
      if (!response.ok) return;
      const data = await response.json();
      page = data.page;

      grid.replaceChildren(...data.projects.map(projectCard));
      document.getElementById("noProjects").hidden = data.projects.length > 0;
      pager.hidden = data.pages <= 1;
      document.getElementById("pageLabel").textContent = `Page ${data.page} of ${data.pages}`;
      prevPage.disabled = data.page <= 1;
      nextPage.disabled = data.page >= data.pages;
    };

    prevPage.onclick = () => { page--; loadProjects(); };
    nextPage.onclick = () => { page++; loadProjects(); };
    loadProjects();
  })();
</script>

<script>
  const picture = document.getElementById("profilePicture");
  const pictureInput = document.getElementById("pictureInput");
  const resetButton = document.getElementById("resetPicture");

  // Same URL, new image: add a timestamp so the browser fetches it again
  const refreshPicture = () => picture.src = "/profile-picture?t=" + Date.now();

  picture.onclick = () => pictureInput.click();

  pictureInput.onchange = async () => {
    if (!pictureInput.files.length) return;

    const form = new FormData();
    form.append("picture", pictureInput.files[0]);
    const response = await fetch("/profile-picture", { method: "POST", body: form });
    pictureInput.value = "";

    if (!response.ok) {
      alert(response.status === 413 ? "That image is too large (5 MB max)." : await response.text());
      return;
    }
    refreshPicture();
    resetButton.hidden = false;
  };

  resetButton.onclick = async () => {
    const response = await fetch("/profile-picture", { method: "DELETE" });
    if (!response.ok) {
      alert("Couldn't reset your profile picture.");
      return;
    }
    refreshPicture();
    resetButton.hidden = true;
  };
</script>

 #line{

 }

  }

  #pager {

  }

  #projects .empty {

  }
</style>
