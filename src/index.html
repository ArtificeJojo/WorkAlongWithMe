<!doctype html>
<meta charset="UTF-8" />
<title>Work Along With Me</title>

<div id="view-error" hidden></div>

<div id="view-unauthenticated">
  <button id="loginButton" onclick="location.href = FLASK_BASE_URL + '/login'">Login</button>
  <button id="signupButton" onclick="location.href = FLASK_BASE_URL + '/login?screen_hint=signup'">Signup</button>
  <h1>Work Along With Me</h1>
  <p>Find your perfect CS project group</p>
</div>

<script>
  // Flask server (currently forwarded through ngrok)
  const FLASK_BASE_URL = "";

  // Show errors that Flask's /callback passes back after a failed login
  if (location.search.includes("error=")) {
    const params = new URLSearchParams(location.search);
    const errorView = document.getElementById("view-error");
    errorView.textContent = `Error: ${params.get("error")} — ${params.get("error_description")}`;
    errorView.hidden = false;
    history.replaceState({}, "", location.pathname);
  }
</script>

</body>
<style>
  body {
    background-image: url("../Images/bg.png");
    font-family: "Impact", "Charcoal", sans-serif;
    text-align: center;
    margin-top: 200px;
  }

   h1 {
    order: 1;
    margin-bottom: 20px;
    color: white;
  }

  p {
    order: 2;
    margin-top: 0;
    color: white;
  }

  button {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    background-color: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
    align-items: center;
    order: 3;
  }

  #loginButton {
   width: 120px;
   height: 50px;
   border-radius: 8px;
  }

  #signupButton {
   width: 100px;
   height: 40px;
    border-radius: 8px;
  }

  #view-unauthenticated {
    display: flex;
    flex-direction: column;
    align-items: center;
    
  }

  button:hover{
    background-color: rgb(107, 204, 236);
    animation: shake 0.4s;
  }


@keyframes shake {
  0% { transform: translate(1px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -2px) rotate(-1deg); }
  20% { transform: translate(-3px, 0px) rotate(1deg); }
  30% { transform: translate(3px, 2px) rotate(0deg); }
  40% { transform: translate(1px, -1px) rotate(1deg); }
  50% { transform: translate(-1px, 2px) rotate(-1deg); }
  60% { transform: translate(-3px, 1px) rotate(0deg); }
  70% { transform: translate(3px, 1px) rotate(-1deg); }
  80% { transform: translate(-1px, -1px) rotate(1deg); }
  90% { transform: translate(1px, 2px) rotate(0deg); }
  100% { transform: translate(1px, -2px) rotate(-1deg); }
}
</style>
