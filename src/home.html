<!doctype html>
<meta charset="UTF-8" />
<title>Work Along With Me</title>



<div id="profileBar">
  <img id="profilePicture" src="/profile-picture" alt="Profile picture" title="View profile" onclick="location.href = '/profile'" />
  <button onclick="location.href = '/profile'">View profile</button>
  <h1>{{ username }}</h1>
</div>

<div id="underPB">
  <h2>{{ organization }}</h2>
  <button onclick="location.href = '/logout'">Logout</button>
  <button onclick="location.href = '/project_create'">Create project</button>
</div>

<div class="screenframe"></div>

<section id="projectFeed">
  <h2>Latest from your friends and teammates</h2>
  {% for project in projects %}
    <article class="project-card">
      {% if project.thumbnail %}
        <img class="thumbnail" src="{{ project.thumbnail }}" alt="" />
      {% endif %}
      <h3>{{ project.title }}</h3>
      <button onclick="location.href = '/project/{{ project.id }}'">Check out project</button>
    </article>
  {% else %}
    <p class="empty">No projects from your friends or teammates yet.</p>
  {% endfor %}
</section>

<style>
  #topBar {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  #profileBar {
    display: flex;
    align-items: center;
    gap: 16px;
    justify-content: center;
    margin-top: 100px;
    margin-bottom: 0;
  }

  #profilePicture {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    cursor: pointer;
  }

  #underPB {
    align-items: center;
    gap: 16px;
    justify-content: center;
    margin-left: 750px;
  }

  body {
    background-color: #d6b65e;
    font-family: Arial, sans-serif;
  }

  #projectFeed {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin: 40px auto;
    max-width: 480px;
  }

  .project-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    background-color: rgba(255, 255, 255, 0.4);
    border-radius: 12px;
  }

  .project-card h3 {
    margin: 0;
  }

  .project-card .thumbnail {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
  }

  .empty {
    color: #555;
  }

  .screenframe{
    position: fixed;
    inset: 6px;                  /* top/right/bottom/left = 0 */
    border: 4px solid rgb(35, 105, 246);
    border-radius: 16px;
    pointer-events: none;      /* lets you still click the things underneath */
    box-sizing: border-box;
     /* 100% minus the border width */
  }     
  
  #topBar{
    justify-content: center;
    align-items: center;
  }

  button{
    border-radius: 16px;
  }
</style>
s
