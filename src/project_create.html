<!doctype html>
<meta charset="UTF-8" />
<title>Work Along With Me</title>

<button id="homeButton" onclick="location.href = '/home'">Home</button>

{# Used for both /project_create (project is None) and /project/<id>/edit (filled in) #}
<h1>{% if project %}Edit project{% else %}Create a project{% endif %}</h1>

<form id="projectForm" novalidate>
  <label for="title">Title <span class="required">*</span></label>
  <input id="title" name="title" maxlength="100" value="{% if project %}{{ project.title }}{% endif %}" />

  <label for="summary">Short summary <span class="required">*</span></label>
  <textarea id="summary" name="summary" rows="2" maxlength="300">{% if project %}{{ project.summary }}{% endif %}</textarea>

  <label for="description">Description</label>
  <textarea id="description" name="description" rows="8" maxlength="10000">{% if project %}{{ project.description }}{% endif %}</textarea>

  <label for="thumbnail">Thumbnail</label>
  <input id="thumbnail" name="thumbnail" type="file" accept=".jpg,.jpeg,.png,.gif,.webp" />
  <img id="thumbnailPreview" alt="" hidden />
  <button id="removeThumbnail" type="button" hidden>Remove thumbnail</button>

  <label for="teammateSearch">Invite teammates</label>
  <ul id="teammates" class="user-list"></ul>
  <input id="teammateSearch" type="search" placeholder="Search by username" autocomplete="off" />
  <ul id="searchResults" class="user-list"></ul>

  <p id="formError" role="alert" hidden></p>
  <button id="submitButton" type="submit">{% if project %}Save changes{% else %}Submit{% endif %}</button>
</form>

<script>
  // The project being edited, or null when creating a new one
  const existing = {{ project|tojson }};

  const form = document.getElementById("projectForm");
  const formError = document.getElementById("formError");
  const mandatory = ["title", "summary"].map(id => document.getElementById(id));

  // Thumbnail preview; when editing, starts as the current thumbnail and can be removed
  const thumbnail = document.getElementById("thumbnail");
  const preview = document.getElementById("thumbnailPreview");
  const removeThumbnailButton = document.getElementById("removeThumbnail");
  let removeThumbnail = false;

  const showPreview = src => {
    preview.hidden = !src;
    removeThumbnailButton.hidden = !src;
    if (src) preview.src = src;
  };

  thumbnail.onchange = () => {
    const file = thumbnail.files[0];
    if (file) removeThumbnail = false;
    showPreview(file ? URL.createObjectURL(file) : (!removeThumbnail && existing && existing.thumbnail));
  };

  removeThumbnailButton.onclick = () => {
    thumbnail.value = "";
    removeThumbnail = true;
    showPreview(null);
  };

  if (existing) showPreview(existing.thumbnail);

  // Teammates picked so far, by user id. When editing, starts with current members and pending invites.
  const teammates = new Map(existing ? existing.teammates.map(user => [user.id, user]) : []);

  // One row: picture, username, smaller ID, then any buttons (same look as /connections)
  const userItem = (user, ...buttons) => {
    const item = document.createElement("li");

    const picture = document.createElement("img");
    picture.src = user.picture;
    picture.alt = "";

    const name = document.createElement("span");
    name.className = "username";
    name.textContent = user.username;

    const id = document.createElement("span");
    id.className = "user-id";
    id.textContent = user.id;

    const text = document.createElement("div");
    text.append(name, id);
    item.append(picture, text, ...buttons);
    return item;
  };

  const button = (label, onclick, disabled = false) => {
    const element = document.createElement("button");
    element.type = "button";  // don't submit the form
    element.textContent = label;
    element.onclick = onclick;
    element.disabled = disabled;
    return element;
  };

  // Existing teammates show whether they've joined; anyone added now gets invited on save
  const statusLabel = user => {
    const label = document.createElement("span");
    label.className = "status";
    label.textContent = { accepted: "Member", pending: "Invited" }[user.status] || "Will be invited";
    return label;
  };

  const renderTeammates = () => {
    document.getElementById("teammates").replaceChildren(...[...teammates.values()].map(user => userItem(user,
      ...(existing ? [statusLabel(user)] : []),
      button("Remove", () => { teammates.delete(user.id); renderTeammates(); runSearch(); }),
    )));
  };

  renderTeammates();

  // Search: same rules as /connections (up to 7, starts-with, alphabetical),
  // except teammates already added are left out
  const searchInput = document.getElementById("teammateSearch");
  const searchResults = document.getElementById("searchResults");
  let latestSearch = 0;

  const addButton = user => {
    if (user.relationship === "self") return [];
    if (user.relationship === "blocked") return [button("Blocked", null, true)];
    return [button("Add", () => { teammates.set(user.id, user); renderTeammates(); runSearch(); })];
  };

  const runSearch = async () => {
    const query = searchInput.value;
    const searchId = ++latestSearch;

    if (!query) {
      searchResults.replaceChildren();
      return;
    }

    const params = new URLSearchParams({ limit: 7, q: query });
    teammates.forEach((_, id) => params.append("exclude", id));
    const response = await fetch("/users/search?" + params);
    // Typing fast (or adding/removing teammates) can make responses arrive out of order; only show the newest one
    if (searchId !== latestSearch || !response.ok) return;

    const users = await response.json();
    searchResults.replaceChildren(...users.map(user => userItem(user, ...addButton(user))));
  };

  searchInput.oninput = runSearch;
  // Enter in the search box shouldn't submit the project
  searchInput.onkeydown = event => { if (event.key === "Enter") event.preventDefault(); };

  // Missing mandatory fields: red message + yellow highlight until they're filled in
  const showMissing = (fields, message) => {
    mandatory.forEach(input => input.classList.toggle("missing", fields.includes(input.id)));
    formError.textContent = message;
    formError.hidden = false;
  };

  mandatory.forEach(input => input.oninput = () => {
    if (input.value.trim()) input.classList.remove("missing");
  });

  form.onsubmit = async event => {
    event.preventDefault();

    const missing = mandatory.filter(input => !input.value.trim()).map(input => input.id);
    if (missing.length) {
      showMissing(missing, "Some mandatory fields have not been completed.");
      return;
    }

    const data = new FormData(form);
    data.delete("teammateSearch");
    teammates.forEach((_, id) => data.append("contributors", id));
    if (removeThumbnail) data.append("removeThumbnail", "true");

    const submitButton = document.getElementById("submitButton");
    submitButton.disabled = true;
    const url = existing ? `/project/${existing.id}/edit` : "/project_create";
    const response = await fetch(url, { method: "POST", body: data });
    submitButton.disabled = false;

    if (response.ok) {
      location.href = existing ? `/project/${existing.id}` : "/home";
      return;
    }
    if (response.status === 413) {
      showMissing([], "That thumbnail is too large (5 MB max).");
      return;
    }
    const error = await response.json().catch(() => ({ error: "Couldn't save the project.", missing: [] }));
    showMissing(error.missing || [], error.error);
  };
</script>

<style>
  body {
    background-image: url('/Images/bg.png');
    font-family: "Unknown Font", monospace;
    margin: 20px 40px;
  }

  button {
    background-color: rgb(107, 204, 236);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    border-radius: 16px;
    border: none;
    padding: 6px 14px;
    cursor: pointer;
  }

  button:disabled {
    cursor: default;
    opacity: 0.6;
  }

  label{
    color: white;
  }

  #homeButton {
    position: absolute;
    top: 20px;
    left: 20px;
  }

  h1 {
    margin-top: 50px;
    color: white;
  }

  p {
    color: white;
  }

  #projectForm {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 640px;
  }

  #projectForm label {
    margin-top: 12px;
    font-weight: bold;
  }

  #projectForm input:not([type=file]),
  #projectForm textarea {
    padding: 6px;
    font: inherit;
    border: 1px solid #999;
    border-radius: 4px;
  }

  .required {
    color: #b00020;
  }

  .missing {
    background-color: #ffe066;
  }

  #removeThumbnail {
    align-self: flex-start;
  }

  .user-list .status {
    color: #555;
    font-size: 0.85em;
  }

  #thumbnailPreview {
    max-width: 240px;
    max-height: 160px;
    object-fit: cover;
    border-radius: 8px;
  }

  #formError {
    color: #b00020;
    font-weight: bold;
  }

  #submitButton {
    align-self: flex-start;
    margin-top: 12px;
  }

  .user-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .user-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0;
  }

  .user-list img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 50%;
  }

  .user-list .username {
    display: block;
    font-size: 1.1em;
  }

  .user-list .user-id {
    display: block;
    font-size: 0.75em;
    color: #555;
  }

  button:hover{
    background-color: rgb(107, 204, 236);
    animation: shake 0.4s;
    transform:translateY(1px)
  }

  button:active{
    transform:translateY(-1px)
  }

@keyframes shake {
  0% { transform: translate(1px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -2px) rotate(-1deg); }
  20% { transform: translate(-3px, 0px) rotate(1deg); }
  30% { transform: translate(3px, 2px) rotate(0deg); }
  40% { transform: translate(1px, -1px) rotate(1deg); }
  50% { transform: translate(-1px, 2px) rotate(-1deg); }
  60% { transform: translate(-3px, 1px) rotate(0deg); }
  70% { transform: translate(3px, 1px) rotate(-1deg); }
  80% { transform: translate(-1px, -1px) rotate(1deg); }
  90% { transform: translate(1px, 2px) rotate(0deg); }
  100% { transform: translate(1px, -2px) rotate(-1deg); }
}
</style>
